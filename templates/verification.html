<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification - InsightEval</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }
        .profile-page {
            display: flex;
            min-height: 100vh;
        }
        .left-half {
            flex: 1;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .app-branding {
            text-align: left;
        }
        .app-branding h1 {
            color: #1f2937;
            font-size: 2.5rem;
            font-weight: 700;
            margin-top: 3rem;
            margin-bottom: 3.5rem;
        }
        .right-half {
            flex: 1;
            background: #2583f5;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .profile-form {
            background: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        .profile-form h2 {
            text-align: center;
            color: #1f2937;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            font-weight: 700;
        }
        .flash-success {
            padding: 0.75rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            text-align: center;
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        @media (max-width: 768px) {
            .profile-page {
                flex-direction: column;
            }
            .left-half, .right-half {
                flex: none;
                width: 100%;
                min-height: 50vh;
                padding: 1.5rem;
            }
            .profile-form {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="profile-page">
        <div class="left-half">
            <div class="app-branding">
                <h1>InsightEval</h1>
                <!-- Add logo here if needed -->
                <img src="/static/images/logo.png" alt="InsightEval Logo" style="width: 400px; height: 400px;">
            </div>
        </div>
        <div class="right-half">
            <div class="profile-form">
                <h2>Profile Verification</h2>
                <div class="flash-success">
                    Your profile has been sent for verification. Thank you!
                </div>
            </div>
        </div>
    </div>
    <script>
        // Prevent back navigation
        (function() {
            history.pushState(null, null, location.href);
            window.onpopstate = function(event) {
                history.pushState(null, null, location.href);
            };
            // Repeatedly clear history to prevent back navigation
            setInterval(function() {
                history.pushState(null, null, location.href);
            }, 100);
        })();
    </script>
</body>
</html>
