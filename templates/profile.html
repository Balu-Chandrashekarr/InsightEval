<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - InsightEval</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .profile-pic-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .profile-pic-preview {
            width: 128px;
            height: 128px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
        }
        .input-field {
            display: none;
        }
        .nav-link {
            padding: 10px 20px;
            color: #555;
            transition: all 0.3s ease;
        }
        .nav-link.active {
            font-weight: bold;
            border-bottom: 2px solid #0d6efd;
            color: #0d6efd;
            background-color: transparent;
        }
        .nav-link:not(.active):hover {
            color: #0d6efd;
        }
        .scrollable-container {
            max-height: 505px;
            overflow-y: auto;
            margin-bottom: 0.5rem;
        }
        .right-container {
            position: relative;
            padding-bottom: 4rem;
        }
        .fixed-add-button {
            position: absolute;
            bottom: 1.5rem;
            right: 1.5rem;
        }
    </style>

</head>
<body class="bg-gray-100 font-sans">
    <header class="bg-blue-600 text-white py-2">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <h1 class="text-3xl font-bold">Profile</h1>
            <button id="headerLogout" class="bg-red-500 text-white py-1 px-3 rounded-md hover:bg-red-600">Logout</button>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <div class="flex flex-col md:flex-row gap-8">
            <!-- Left Side -->
            <div class="w-full md:w-2/5 bg-white p-6 rounded-lg shadow-md">
                <div class="mb-4">
                    <div class="input-group">
                        <div class="profile-pic-container">
                            <img src="{{ url_for('static', filename='images/defaultprofilepic.jpg') }}" alt="Profile Picture" class="profile-pic-preview" id="preview" onclick="document.getElementById('profile_pic').click()">
                            <input type="file" id="profile_pic" accept="image/*" class="input-field" onchange="previewImage(event)">
                        </div>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="name" class="block text-gray-700 font-semibold mb-2">Name</label>
                    <input type="text" id="name" class="w-full p-2 border rounded-md" value="{{ session.user_name or 'User Name' }}">
                </div>
                <div class="mb-4">
                    <label for="id" class="block text-gray-700 font-semibold mb-2">ID</label>
                    <input type="text" id="id" class="w-full p-2 border rounded-md" value="1NHCS057">
                </div>
                <div class="mb-4">
                    <label for="department" class="block text-gray-700 font-semibold mb-2">Department</label>
                    <input type="text" id="department" class="w-full p-2 border rounded-md" value="Computer Science and Engineering">
                </div>
                <div class="mb-4">
                    <label for="bio" class="block text-gray-700 font-semibold mb-2">Bio</label>
                    <textarea id="bio" class="w-full p-2 border rounded-md" rows="4" maxlength="200" placeholder="Enter Bio here"></textarea>
                </div>
                <div class="flex justify-between space-x-4 mb-4">
                    <button id="resetPassword" class="bg-gray-500 text-white py-2 px-4 rounded-md hover:bg-gray-600">Reset Password</button>
                    <button id="save" class="bg-green-500 text-white py-2 px-4 rounded-md hover:bg-green-600 hidden">Save</button>
                </div>
            </div>
            <!-- Right Side -->
            <div class="w-full md:w-3/5 bg-white p-6 rounded-lg shadow-md flex flex-col right-container">
                <nav class="mb-6 bg-gray-100 p-3 rounded-md">
                    <ul class="flex justify-start space-x-6">
                        <li><a href="#" class="nav-link active" data-tab="posts">Post</a></li>
                        <li><a href="#" class="nav-link" data-tab="classrooms">ClassRoom</a></li>
                    </ul>
                </nav>
                <div id="content" class="scrollable-container">
                    <div id="posts" class="tab-content grid grid-cols-2 gap-4">
                        <!-- Posts will be added here -->
                    </div>
                    <div id="classrooms" class="tab-content hidden grid grid-cols-3 gap-4">
                        <!-- Classrooms will be added here -->
                    </div>
                    <div id="addPostForm" class="tab-content hidden">
                        <div class="mb-4">
                            <label for="postImage" class="block text-gray-700 font-semibold mb-2">Image</label>
                            <input type="file" id="postImage" accept="image/*" class="w-full p-2 border rounded-md">
                        </div>
                        <div class="mb-4">
                            <label for="postDescription" class="block text-gray-700 font-semibold mb-2">Description</label>
                            <textarea id="postDescription" class="w-full p-2 border rounded-md" rows="3" maxlength="100" placeholder="Enter a short description"></textarea>
                        </div>
                        <div class="flex justify-end space-x-2">
                            <button id="submitPost" class="bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600">Submit</button>
                            <button id="cancelPost" class="bg-gray-300 text-gray-700 py-2 px-4 rounded-md hover:bg-gray-400">Cancel</button>
                        </div>
                    </div>
                    <div id="addClassroomForm" class="tab-content hidden">
                        <div class="mb-4">
                            <label for="classroomName" class="block text-gray-700 font-semibold mb-2">Classroom Name</label>
                            <input type="text" id="classroomName" class="w-full p-2 border rounded-md" placeholder="Enter classroom name">
                        </div>
                        <div class="flex justify-end space-x-2">
                            <button id="submitClassroom" class="bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600">Submit</button>
                            <button id="cancelClassroom" class="bg-gray-300 text-gray-700 py-2 px-4 rounded-md hover:bg-gray-400">Cancel</button>
                        </div>
                    </div>
                </div>
                <div class="fixed-add-button">
                    <button id="addButton" class="bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600">Add</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-gray-800 text-white py-4">
        <div class="container mx-auto px-4">
            <p class="text-center">Footer Section</p>
        </div>
    </footer>

    <script>
        // Detect changes to show Save button (profile)
        const inputs = document.querySelectorAll('#profile_pic, #name, #id, #department, #bio');
        const saveButton = document.getElementById('save');

        inputs.forEach(input => {
            input.addEventListener('change', () => {
                saveButton.classList.remove('hidden');
            });
        });

        document.getElementById('bio').value = 'hai\nhello\nenghene';

        // Preview profile picture
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('preview').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // Navigation tab switching and highlight
        const navLinks = document.querySelectorAll('.nav-link');
        const tabContents = document.querySelectorAll('.tab-content');
        const addButton = document.getElementById('addButton');

        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                navLinks.forEach(l => l.classList.remove('active'));
                link.classList.add('active');

                const tab = link.getAttribute('data-tab');
                tabContents.forEach(content => content.classList.add('hidden'));
                document.getElementById(tab).classList.remove('hidden');
                document.getElementById('addPostForm').classList.add('hidden');
                document.getElementById('addClassroomForm').classList.add('hidden');
            });
        });

        // Show appropriate form when Add button is clicked
        addButton.addEventListener('click', () => {
            const activeTab = document.querySelector('.nav-link.active').getAttribute('data-tab');
            tabContents.forEach(content => content.classList.add('hidden'));
            if (activeTab === 'posts') {
                document.getElementById('addPostForm').classList.remove('hidden');
            } else if (activeTab === 'classrooms') {
                document.getElementById('addClassroomForm').classList.remove('hidden');
            }
        });

        // Submit post
        document.getElementById('submitPost').addEventListener('click', () => {
            const postImage = document.getElementById('postImage').files[0];
            const postDescription = document.getElementById('postDescription').value;

            if (postDescription || postImage) {
                const postContainer = document.getElementById('posts');
                const postDiv = document.createElement('div');
                postDiv.className = 'p-4 border rounded-md';
                
                if (postImage) {
                    const img = document.createElement('img');
                    img.className = 'w-full h-48 object-cover rounded-md mb-2';
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(postImage);
                    postDiv.appendChild(img);
                }
                
                if (postDescription) {
                    const desc = document.createElement('p');
                    desc.className = 'text-gray-600 text-sm';
                    desc.textContent = postDescription;
                    postDiv.appendChild(desc);
                }

                postContainer.prepend(postDiv);
                document.getElementById('postImage').value = '';
                document.getElementById('postDescription').value = '';
                document.getElementById('addPostForm').classList.add('hidden');
                document.getElementById('posts').classList.remove('hidden');
            }
        });

        // Cancel post
        document.getElementById('cancelPost').addEventListener('click', () => {
            document.getElementById('postImage').value = '';
            document.getElementById('postDescription').value = '';
            document.getElementById('addPostForm').classList.add('hidden');
            document.getElementById('posts').classList.remove('hidden');
        });

        // Submit classroom
        document.getElementById('submitClassroom').addEventListener('click', () => {
            const classroomName = document.getElementById('classroomName').value;
            const today = new Date().toISOString().split('T')[0]; // Get current date in YYYY-MM-DD format

            if (classroomName) {
                const classroomContainer = document.getElementById('classrooms');
                const classroomDiv = document.createElement('div');
                classroomDiv.className = 'mb-4 p-4 border rounded-md';
                
                const name = document.createElement('h3');
                name.className = 'text-lg font-semibold';
                name.textContent = classroomName;
                classroomDiv.appendChild(name);
                
                const date = document.createElement('p');
                date.className = 'text-gray-600';
                date.textContent = `Created: ${today}`;
                classroomDiv.appendChild(date);

                classroomContainer.prepend(classroomDiv);
                document.getElementById('classroomName').value = '';
                document.getElementById('addClassroomForm').classList.add('hidden');
                document.getElementById('classrooms').classList.remove('hidden');
            }
        });

        // Cancel classroom
        document.getElementById('cancelClassroom').addEventListener('click', () => {
            document.getElementById('classroomName').value = '';
            document.getElementById('addClassroomForm').classList.add('hidden');
            document.getElementById('classrooms').classList.remove('hidden');
        });

        document.getElementById('headerLogout').addEventListener('click', () => {
            window.location.href = '{{ url_for("logout") }}';
        });

    </script>
</body>
</html>
