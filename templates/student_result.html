<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Test Result - InsightEval</title>
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            color: #1e293b;
            min-height: 100vh;
            padding: 0;
        }

        .hero-section {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(96, 165, 250, 0.05) 100%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(59, 130, 246, 0.15);
            padding: 60px 40px;
            text-align: center;
        }

        .hero-section h1 {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 50%, #60a5fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0 0 30px 0;
            letter-spacing: -0.02em;
        }

        .test-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .info-card {
            background: white;
            border: 1px solid rgba(59, 130, 246, 0.15);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.08);
            transition: all 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.15);
        }

        .info-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .info-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1e293b;
        }

        .content-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 40px;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 40px;
            margin-bottom: 50px;
        }

        .result-card {
            background: white;
            border: 2px solid rgba(59, 130, 246, 0.15);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(59, 130, 246, 0.1);
            transition: all 0.3s ease;
        }

        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(59, 130, 246, 0.15);
        }

        .student-name {
            font-size: 2rem;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid rgba(59, 130, 246, 0.2);
        }

        .score-circle {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 30px auto;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            box-shadow: 0 20px 60px rgba(59, 130, 246, 0.3);
            position: relative;
        }

        .score-circle::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.5), rgba(59, 130, 246, 0.5));
            z-index: -1;
            filter: blur(10px);
        }

        .marks-display {
            font-size: 5rem;
            font-weight: 900;
            color: white;
            line-height: 1;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .total-marks {
            font-size: 1.5rem;
            color: white;
            opacity: 0.95;
            margin-top: 10px;
        }

        .status-badge {
            display: inline-block;
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 1.125rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .status-completed {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .status-undergoing {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }

        .feedback-section {
            background: white;
            border: 1px solid rgba(59, 130, 246, 0.15);
            border-radius: 24px;
            padding: 50px;
            box-shadow: 0 10px 40px rgba(59, 130, 246, 0.1);
        }

        .feedback-title {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .feedback-content {
            font-size: 1.125rem;
            color: #475569;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .performance-indicator {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 700;
            margin-top: 20px;
        }

        .perf-excellent {
            background: #d1fae5;
            color: #065f46;
        }

        .perf-good {
            background: #dbeafe;
            color: #1e40af;
        }

        .perf-average {
            background: #fef3c7;
            color: #92400e;
        }

        .perf-needswork {
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 1024px) {
            .result-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .hero-section h1 {
                font-size: 2rem;
            }

            .hero-section {
                padding: 40px 20px;
            }

            .content-wrapper {
                padding: 40px 20px;
            }

            .result-card {
                padding: 40px 24px;
            }

            .feedback-section {
                padding: 30px 24px;
            }

            .score-circle {
                width: 180px;
                height: 180px;
            }

            .marks-display {
                font-size: 4rem;
            }

            .student-name {
                font-size: 1.5rem;
            }

            .test-info-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .result-card {
                padding: 30px 20px;
            }

            .score-circle {
                width: 160px;
                height: 160px;
            }

            .marks-display {
                font-size: 3.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="hero-section">
        <h1 id="test-title">Test Result</h1>
        <div class="test-info-grid">
            <div class="info-card">
                <div class="info-label">Test Code</div>
                <div class="info-value" id="test-code">Loading...</div>
            </div>
            <div class="info-card">
                <div class="info-label">Total Marks</div>
                <div class="info-value" id="total-marks">Loading...</div>
            </div>
        </div>
    </div>

    <div class="content-wrapper">
        <div class="result-grid">
            <div class="result-card">
                <div class="student-name" id="student-name">Student Name</div>
                
                <div class="score-circle">
                    <div class="marks-display" id="marks-display">0</div>
                    <div class="total-marks" id="marks-total">out of 0</div>
                </div>
                
                <div class="status-badge status-completed" id="status">Completed</div>
                
                <div class="performance-indicator perf-excellent" id="performance" style="display: none;">
                    Excellent Performance
                </div>
            </div>
        </div>

        <div class="feedback-section">
            <div class="feedback-title">
                🤖 AI-Powered Feedback
            </div>
            <div class="feedback-content" id="feedback-content">
                Loading feedback...
            </div>
        </div>
    </div>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const classroom = urlParams.get("classroom");
        const test = urlParams.get("test");

        if (!classroom || !test) {
            alert("Missing classroom or test ID");
            return;
        }

        try {
            const res = await fetch(`/api/get_student_result?classroom=${classroom}&test=${test}`);
            const data = await res.json();

            // Populate test info
            document.getElementById("test-title").textContent = data.test_info?.title || "Test Result";
            document.getElementById("test-code").textContent = data.test_info?.code || "N/A";
            document.getElementById("total-marks").textContent = data.result?.total || 0;

            // Populate student result
            document.getElementById("student-name").textContent = data.student_email || "Unknown Student";
            document.getElementById("marks-display").textContent = data.result?.score || 0;
            document.getElementById("marks-total").textContent = `out of ${data.result?.total || 0}`;
            document.getElementById("feedback-content").textContent = data.result?.feedback || 'No feedback available';

            // Calculate percentage and show performance indicator
            const score = data.result?.score || 0;
            const total = data.result?.total || 1;
            const percentage = (score / total) * 100;

            const perfIndicator = document.getElementById("performance");
            perfIndicator.style.display = "inline-block";

            if (percentage >= 90) {
                perfIndicator.textContent = "🏆 Outstanding Performance!";
                perfIndicator.className = "performance-indicator perf-excellent";
            } else if (percentage >= 70) {
                perfIndicator.textContent = "✨ Great Job!";
                perfIndicator.className = "performance-indicator perf-good";
            } else if (percentage >= 50) {
                perfIndicator.textContent = "👍 Good Effort";
                perfIndicator.className = "performance-indicator perf-average";
            } else {
                perfIndicator.textContent = "💪 Keep Practicing";
                perfIndicator.className = "performance-indicator perf-needswork";
            }

            // Update status
            const statusBadge = document.getElementById("status");
            if (data.result?.status === "Completed") {
                statusBadge.textContent = "✓ Completed";
                statusBadge.className = "status-badge status-completed";
            } else {
                statusBadge.textContent = "⏳ In Progress";
                statusBadge.className = "status-badge status-undergoing";
            }

        } catch (err) {
            console.error("Error fetching result:", err);
            alert("Failed to load result");
        }
    });
</script>

</body>
</html>
