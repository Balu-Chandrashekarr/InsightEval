{% extends 'base.html' %}
{% block title %}Dashboard - InsightEval{% endblock %}
{% block content %}
<div class="login-page">
    <div class="left-half">
        <div class="app-branding">
            <h1>InsightEval</h1>
            <img src="{{ url_for('static', filename='images/login.jpg') }}" alt="InsightEval Logo" class="app-logo">
        </div>
    </div>
    <div class="right-half">
        <div class="login-form">
            <h2>Welcome to Your Dashboard</h2>
            <p>This is your dashboard. More features coming soon!</p>
            <p><a href="{{ url_for('login') }}">Back to Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
