<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Test Results - InsightEval</title>
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            color: #1e293b;
            height: 100vh;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .hero-section {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(96, 165, 250, 0.05) 100%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(59, 130, 246, 0.15);
            padding: 20px 30px;
            text-align: center;
            flex-shrink: 0;
        }

        .hero-section h1 {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 50%, #60a5fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0 0 14px 0;
            letter-spacing: -0.02em;
        }

        .test-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .info-card {
            background: white;
            border: 1px solid rgba(59, 130, 246, 0.15);
            border-radius: 10px;
            padding: 10px 16px;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.08);
            transition: all 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.15);
        }

        .info-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: 800;
            color: #1e293b;
        }

        .content-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 30px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            width: 100%;
        }

        .controls-section {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-right: 5px;
            justify-content: right;
            margin-bottom: -55px;
            flex-shrink: 0;
        }

        .btn {
            padding: 10px 24px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            margin-left: 10px;
            text-align: left;
            flex-shrink: 0;
        }

        .table-container {
            background: white;
            border: 1px solid rgba(59, 130, 246, 0.15);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(59, 130, 246, 0.1);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .table-wrapper {
            overflow-y: auto;
            flex: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            padding: 14px 12px;
            text-align: left;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 14px 12px;
            border-bottom: 1px solid #e2e8f0;
            color: #475569;
            font-size: 0.9rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tbody tr {
            transition: all 0.2s ease;
        }

        tbody tr:hover {
            background-color: #f8fafc;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-completed {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .status-undergoing {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .marks {
            font-weight: 800;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .email {
            font-weight: 600;
            color: #1e293b;
        }

        .name {
            font-weight: 600;
            color: #1e293b;
        }

        .feedback {
            max-width: 350px;
            line-height: 1.4;
            color: #64748b;
            font-size: 0.85rem;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            body {
                height: auto;
                overflow: auto;
            }

            .content-wrapper {
                min-height: auto;
            }

            table, thead, tbody, th, td, tr { 
                display: block; 
            }
            
            thead tr { 
                position: absolute; 
                top: -9999px; 
                left: -9999px; 
            }
            
            tr { 
                border: 1px solid rgba(59, 130, 246, 0.15);
                border-radius: 12px; 
                margin-bottom: 16px; 
                padding: 16px;
                background: white;
                box-shadow: 0 4px 16px rgba(59, 130, 246, 0.08);
            }
            
            td { 
                border: none; 
                position: relative; 
                padding-left: 45%; 
                text-align: right; 
                padding-top: 10px; 
                padding-bottom: 10px; 
            }
            
            td:before { 
                content: attr(data-label); 
                position: absolute; 
                left: 12px; 
                width: 40%; 
                padding-right: 10px; 
                white-space: nowrap; 
                font-weight: 700; 
                color: #1e293b; 
                text-align: left; 
            }
            
            .status { 
                display: inline-block; 
            }
            
            th { 
                display: none; 
            }

            .feedback {
                max-width: 100%;
                text-align: right;
            }

            .table-wrapper {
                overflow-y: visible;
            }
        }

        @media (max-width: 768px) {
            .hero-section h1 {
                font-size: 1.35rem;
            }

            .hero-section {
                padding: 16px;
            }

            .content-wrapper {
                padding: 20px 16px;
            }

            .test-info-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .controls-section {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .hero-section h1 {
                font-size: 1.2rem;
            }

            .section-title {
                font-size: 1.25rem;
            }

            .test-info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="hero-section">
        <h1 id="test-title">Test Results Dashboard</h1>
        <div class="test-info-grid">
            <div class="info-card">
                <div class="info-label">Test Code</div>
                <div class="info-value" id="test-code">Loading...</div>
            </div>
            <div class="info-card">
                <div class="info-label">Total Marks</div>
                <div class="info-value" id="total-marks">Loading...</div>
            </div>
            <div class="info-card">
                <div class="info-label">Students Attended</div>
                <div class="info-value" id="total-students">Loading...</div>
            </div>
            <div class="info-card">
                <div class="info-label">Average Score</div>
                <div class="info-value" id="average-score">Loading...</div>
            </div>
            <div class="info-card">
                <div class="info-label">Highest Score</div>
                <div class="info-value" id="highest-score">Loading...</div>
            </div>
        </div>
    </div>

    <div class="content-wrapper">
        <div class="controls-section">
            <button class="btn" onclick="sortTableByMarks()">Sort by Highest Marks</button>
            <button class="btn" onclick="sortTableByName()">Sort by Name</button>
        </div>

        <h2 class="section-title">Student Results</h2>
        
        <div class="table-container">
            <div class="table-wrapper">
                <table id="resultsTable">
                    <thead>
                        <tr>
                            <th>Email</th>
                            <th>Name</th>
                            <th>Status</th>
                            <th>AI Feedback</th>
                            <th>Marks</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data will be populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

   <script>
document.addEventListener("DOMContentLoaded", async () => {
    const urlParams = new URLSearchParams(window.location.search);
    const classroom = urlParams.get("classroom");
    const test = urlParams.get("test");

    if (!classroom || !test) {
        alert("Missing classroom or test ID");
        return;
    }

    try {
        const res = await fetch(`/api/get_test_results?classroom=${classroom}&test=${test}`);
        const data = await res.json();

        if (!data.success) {
            document.body.innerHTML = `<h2 style="text-align:center;color:red;">${data.error || "No results found"}</h2>`;
            return;
        }

        // Fill test info
        document.getElementById("test-title").textContent = data.test_info?.title || "Test Results Dashboard";
        document.getElementById("test-code").textContent = data.test_info?.code || "N/A";
        document.getElementById("total-marks").textContent = data.test_info?.total || 0;

        // Calculate statistics
        const completedStudents = data.students.filter(s => s.status.toLowerCase() === "completed");
        const totalStudents = completedStudents.length;
        
        let totalScore = 0;
        let highestScore = 0;
        
        completedStudents.forEach(student => {
            const score = parseFloat(student.marks.split("/")[0]) || 0;
            totalScore += score;
            if (score > highestScore) {
                highestScore = score;
            }
        });
        
        const averageScore = totalStudents > 0 ? (totalScore / totalStudents).toFixed(1) : 0;
        const totalMarks = data.test_info?.total || 0;
        const averagePercentage = totalMarks > 0 ? ((averageScore / totalMarks) * 100).toFixed(1) : 0;
        
        // Update statistics display
        document.getElementById("total-students").textContent = totalStudents;
        document.getElementById("average-score").textContent = `${averagePercentage}%`;
        document.getElementById("highest-score").textContent = `${highestScore}/${totalMarks}`;

        // Fill students table
        const tbody = document.querySelector("#resultsTable tbody");
        tbody.innerHTML = "";

        data.students.forEach(student => {
            const tr = document.createElement("tr");

            // Email
            const emailTd = document.createElement("td");
            emailTd.className = "email";
            emailTd.setAttribute("data-label", "Email");
            emailTd.textContent = student.student_email;
            tr.appendChild(emailTd);

            // Name
            const nameTd = document.createElement("td");
            nameTd.className = "name";
            nameTd.setAttribute("data-label", "Name");
            nameTd.textContent = student.student_name;
            tr.appendChild(nameTd);

            // Status
            const statusTd = document.createElement("td");
            statusTd.setAttribute("data-label", "Status");
            const statusSpan = document.createElement("span");
            statusSpan.classList.add("status");
            if (student.status.toLowerCase() === "completed") {
                statusSpan.classList.add("status-completed");
                statusSpan.textContent = "✓ Completed";
            } else {
                statusSpan.classList.add("status-undergoing");
                statusSpan.textContent = "⏳ Undergoing";
            }
            statusTd.appendChild(statusSpan);
            tr.appendChild(statusTd);

            // Feedback
            const feedbackTd = document.createElement("td");
            feedbackTd.className = "feedback";
            feedbackTd.setAttribute("data-label", "AI Feedback");
            feedbackTd.textContent = student.feedback;
            tr.appendChild(feedbackTd);

            // Marks
            const marksTd = document.createElement("td");
            marksTd.className = "marks";
            marksTd.setAttribute("data-label", "Marks");
            marksTd.textContent = student.marks;
            tr.appendChild(marksTd);

            tbody.appendChild(tr);
        });

    } catch (err) {
        console.error("❌ Error fetching test results:", err);
        document.body.innerHTML = `<h2 style="text-align:center;color:red;">Error loading results. Please try again later.</h2>`;
    }
});

// Sorting functions
function sortTableByMarks() { sortTable(4, 'desc'); }
function sortTableByName() { sortTable(1, 'asc'); }

function sortTable(colIndex, order) {
    const table = document.getElementById("resultsTable");
    const tbody = table.tBodies[0];
    const rows = Array.from(tbody.rows);

    rows.sort((a, b) => {
        let valA = a.cells[colIndex].textContent.trim();
        let valB = b.cells[colIndex].textContent.trim();

        // Marks column (convert to numbers)
        if (colIndex === 4) {
            valA = parseFloat(valA.split("/")[0]) || 0;
            valB = parseFloat(valB.split("/")[0]) || 0;
        }

        if (order === 'desc') return valB - valA;
        else return valA > valB ? 1 : (valA < valB ? -1 : 0);
    });

    rows.forEach(row => tbody.appendChild(row));
}
</script>

</body>
</html>
