<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }
        .assessment-wrapper {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: grid;
            grid-template-columns: 200px 1fr;
            min-height: 70vh;
        }
        .question-nav {
            background-color: #f9fafb;
            padding: 20px;
            border-right: 1px solid #e0e7ff;
        }
        .question-nav ul {
            list-style: none;
            padding: 0;
        }
        .question-nav li {
            padding: 10px;
            cursor: pointer;
            color: #3b82f6;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .question-nav li:hover, .question-nav li.active {
            background-color: #e0e7ff;
            color: #2563eb;
            font-weight: 600;
            border-radius: 4px;
        }
        .question-nav li.answered {
            background-color: #d1fae5;
            color: #065f46;
            font-weight: 600;
        }
        .question-content {
            padding: 30px;
        }
        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            color: #1e40af;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e7ff;
        }
        .question {
            margin-bottom: 25px;
            display: none;
        }
        .question.active {
            display: block;
        }
        .question h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 15px;
        }
        .option {
            display: flex;
            align-items: center;
            margin: 10px 0;
            padding-left: 10px;
        }
        .option input[type="radio"] {
            margin-right: 12px;
            accent-color: #3b82f6;
            transform: scale(1.2);
        }
        .option label {
            font-size: 1rem;
            color: #4b5563;
        }
        .submit-btn {
            background-color: #3b82f6;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.3s ease;
            display: none; /* Hidden by default */
        }
        .submit-btn.visible {
            display: inline-block;
        }
        .submit-btn:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="assessment-wrapper">
            <div class="question-nav">
                <ul id="question-list"></ul>
            </div>
            <div class="question-content">
                <h1 id="course-title"></h1>
                <form id="assessment-form"></form>
            </div>
        </div>
    </div>

   <script>
  // Extract parameters
  const urlParams = new URLSearchParams(window.location.search);
  const course = urlParams.get('course')?.toLowerCase();
  const classroomId = urlParams.get('classroom');
  const testRef = urlParams.get('test');

  console.log("Classroom:", classroomId);
  console.log("Test Ref:", testRef);
  console.log("Course:", course);

  // Map course to title and JSON file
  const courseTitles = {
      'dsa': 'Final Assessment: Data Structures and Algorithms',
      'oops': 'Final Assessment: Object-Oriented Programming',
      'dbms': 'Final Assessment: Database Management Systems',
      'os': 'Final Assessment: Operating Systems',
      'dmml': 'Final Assessment: Data Mining and Machine Learning'
  };
  const courseJson = {
      'dsa': '/json/dsa_questions.json',
      'oops': '/json/oops_questions.json',
      'dbms': '/json/dbms_questions.json',
      'os': '/json/os_questions.json',
      'dmml': '/json/dmml_questions.json'
  };

  document.getElementById('course-title').textContent = courseTitles[course];

  // =========================
  // MAIN LOADER FUNCTION
  // =========================
  async function loadQuestions() {

    if (classroomId && testRef) {
      console.log("Fetching classroom test from backend...");
      try {
        const response = await fetch(`/get_test_data/${classroomId}/${testRef}`);
        const data = await response.json();
        if (!data.success) throw new Error(data.error || "Failed to fetch test data");
        const wrapper = data.test;
        const test = wrapper.test ? wrapper.test : wrapper;
        document.getElementById("course-title").textContent = test.title;
        renderQuestions(test.questions || []);
      } catch (err) {
        console.error("Error fetching test:", err);
        document.getElementById('assessment-form').innerHTML =
          '<p class="text-red-600">Error loading classroom test. Please try again later.</p>';
      }
    } else {
      console.log("Loading static course assessment...");
      try {
        const response = await fetch(courseJson[course]);
        if (!response.ok) throw new Error('Failed to load questions');
        const data = await response.json();
        const questions = data.questions;
        for (let i = questions.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [questions[i], questions[j]] = [questions[j], questions[i]];
        }
        const selected = questions.slice(0, 20);
        renderQuestions(selected);
      } catch (err) {
        console.error('Error loading static questions:', err);
        document.getElementById('assessment-form').innerHTML =
          '<p class="text-red-600">Error loading static questions.</p>';
      }
    }
  }

  loadQuestions();

  // =========================
  // RENDER FUNCTION (NOW SUPPORTS CODING QUESTIONS)
  // =========================
  function renderQuestions(questions) {
    if (!questions || questions.length === 0) {
      document.getElementById('assessment-form').innerHTML =
        '<p class="text-gray-600">No questions found.</p>';
      return;
    }

    const questionList = document.getElementById('question-list');
    const assessmentForm = document.getElementById('assessment-form');
    questionList.innerHTML = '';
    assessmentForm.innerHTML = '';

    questions.forEach((q, index) => {
      const num = index + 1;

      // Sidebar nav item
      const li = document.createElement('li');
      li.textContent = `Question ${num}`;
      li.dataset.index = index;
      li.addEventListener('click', () => {
        document.querySelectorAll('.question').forEach(q => q.classList.remove('active'));
        document.getElementById(`question-${index}`).classList.add('active');
        document.querySelectorAll('.question-nav li').forEach(li => li.classList.remove('active'));
        li.classList.add('active');
      });
      questionList.appendChild(li);

      // Question block
      const questionDiv = document.createElement('div');
      questionDiv.id = `question-${index}`;
      questionDiv.className = 'question';

      let questionHTML = '';

      if (q.type === "coding") {
      // CODING QUESTION (UPDATED)
      const visibleCases = q.test_cases || [];
      const sampleCasesHTML = visibleCases.length > 0
        ? `
          <details class="mt-5 bg-gray-50 border rounded-lg p-4">
            <summary class="font-semibold cursor-pointer text-gray-800">📘 View Sample Test Cases</summary>
            <div class="mt-3 space-y-3">
              ${visibleCases.map((tc, i) => `
                <div class="border rounded-md p-3 bg-white">
                  <p class="text-sm text-gray-600 font-semibold">Test Case ${i + 1}</p>
                  <p class="text-sm mt-1"><b>Input:</b></p>
                  <pre class="bg-gray-100 text-gray-800 p-2 rounded font-mono text-sm whitespace-pre-wrap">${tc.stdin}</pre>
                  <p class="text-sm mt-1"><b>Expected Output:</b></p>
                  <pre class="bg-gray-100 text-gray-800 p-2 rounded font-mono text-sm whitespace-pre-wrap">${tc.expected}</pre>
                </div>
              `).join("")}
            </div>
          </details>
        `
        : "";

      questionHTML = `
        <h3 class="text-xl font-bold mb-4 whitespace-pre-wrap">${q.question || "Solve the following coding problem:"}</h3>
        <p class="text-gray-600 mb-6 text-sm">Marks: ${q.marks || 10}</p>

        <!-- CODE EDITOR -->
        <div class="bg-gray-900 rounded-lg overflow-hidden shadow-xl">
          <div class="bg-gray-800 px-4 py-3 flex justify-between items-center">
            <select id="lang-${index}" class="bg-gray-700 text-white text-sm rounded px-3 py-1">
              <option value="71">Python</option>
              <option value="62">Java</option>
              <option value="54">C++</option>
              <option value="63">JavaScript</option>
              <option value="52">C</option>
            </select>
            <button type="button" onclick="runCode(${index})"
              class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded">
              Run Code
            </button>
          </div>
          <textarea id="code-${index}" 
                    class="w-full h-96 bg-gray-900 text-green-400 font-mono text-lg p-4 resize-none"
                    placeholder="// Write your code here...">${q.template || ""}</textarea>
        </div>

        <!-- INPUT / OUTPUT PANEL -->
        <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <h4 class="font-bold text-gray-700 mb-2">Input:</h4>
            <textarea id="input-${index}" class="w-full h-32 p-4 border rounded-lg font-mono text-sm" 
                      placeholder="Enter custom input...">${q.sample_input || ""}</textarea>
          </div>
          <div>
            <h4 class="font-bold text-gray-700 mb-2">Output:</h4>
            <pre id="output-${index}" 
                 class="bg-black text-green-400 p-4 rounded-lg h-32 overflow-auto font-mono text-sm">
Click Run to see output
            </pre>
          </div>
        </div>

        ${sampleCasesHTML}
        <input type="hidden" id="coding-answer-${index}" name="q${num}">
      `;
    }  else {
        // MCQ / SHORT ANSWER
        questionHTML = `
          <h3>${q.question}</h3>
          ${q.options ? q.options.map((opt, i) => `
            <div class="option">
              <input type="radio" name="q${num}" value="${opt}" id="q${num}_opt${i}">
              <label for="q${num}_opt${i}">${opt}</label>
            </div>
          `).join('') : 
          `<textarea name="q${num}" class="w-full p-4 border rounded-lg mt-4" rows="4" placeholder="Type your answer here..."></textarea>`
          }
        `;
      }

      questionDiv.innerHTML = questionHTML;
      assessmentForm.appendChild(questionDiv);

      // Mark answered in sidebar
      const inputs = questionDiv.querySelectorAll('input, textarea');
      inputs.forEach(input => {
        input.addEventListener('input', () => {
          const navItem = questionList.children[index];
          if (!navItem.classList.contains('answered')) navItem.classList.add('answered');
        });
      });
    });

    // Show first question
    document.querySelector('.question')?.classList.add('active');
    questionList.firstChild?.classList.add('active');

    // Submit button
    const last = document.getElementById(`question-${questions.length - 1}`);
    if (last) {
      const btn = document.createElement('button');
      btn.type = 'submit';
      btn.className = 'submit-btn visible mt-8';
      btn.textContent = 'Submit Assessment';
      last.appendChild(btn);
    }

    assessmentForm.addEventListener('submit', e => {
      e.preventDefault();
      handleSubmit(questions);
    });
  }

  // =========================
  // RUN CODE FUNCTION (Judge0)
  // =========================
  window.runCode = async function(index) {
    const code = document.getElementById(`code-${index}`).value;
    const lang = document.getElementById(`lang-${index}`).value;
    const input = document.getElementById(`input-${index}`).value;
    const outputEl = document.getElementById(`output-${index}`);

    outputEl.textContent = "Running...";
    outputEl.style.color = "#60a5fa";

    try {
      const res = await fetch('/run_code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, language_id: lang, input })
      });
      const result = await res.json();
      outputEl.textContent = result.output || "No output";
      outputEl.style.color = result.status === "Accepted" ? "#10b981" : "#ef4444";
    } catch (err) {
      outputEl.textContent = "Error: Could not connect to compiler";
      outputEl.style.color = "#ef4444";
    }
  };

 // =========================
// SUBMIT HANDLER – NOW SUPPORTS PROPER MARKS (1, 5, 10)
// =========================
// =========================
// FINAL handleSubmit() – PERFECT MARKING & TYPES
// =========================
// Replace the handleSubmit function in assessment.html

async function handleSubmit(questions) {
    let totalMarks = 0;
    const answers = {};
    const answered = [];

    // Collect all answers (including short answers that need AI grading)
    questions.forEach((q, i) => {
        const num = i + 1;
        const marks = q.marks || 1;
        totalMarks += marks;

        let selected = "Not answered";
        let code = "";              // 🔹 changed to let
        let lang = "";              // 🔹 changed to let
        let testCases = [];         // 🔹 changed to let
        let hiddenTestCases = [];   // 🔹 changed to let
        let correctAnswer = q.answer || "N/A";
        let isCorrect = false;
        const questionType = (q.type || "mcq").toLowerCase();
        const questionText = q.question || "No question text";

        if (questionType === "coding") {
            const codeEl = document.getElementById(`code-${i}`);
            const langEl = document.getElementById(`lang-${i}`);
            code = codeEl ? codeEl.value.trim() : "";
            lang = langEl ? langEl.value : "71"; // default Python

            selected = code ? code : "Not answered";
            correctAnswer = q.expected_output || "Correct code execution expected";
            isCorrect = false; // Will be graded by backend

            // Add test cases (visible + hidden)
            testCases = q.test_cases || [];
            hiddenTestCases = q.hidden_test_cases || [];
        } else if (questionType === "short_answer") {
            const textarea = document.querySelector(`textarea[name="q${num}"]`);
            selected = textarea?.value.trim() || "Not answered";
            correctAnswer = q.answer || "N/A";
            isCorrect = false; // ← AI will grade this!

        } else {
            // MCQ
            const checked = document.querySelector(`input[name="q${num}"]:checked`);
            selected = checked ? checked.value.trim() : "Not answered";
            correctAnswer = q.answer || "N/A";
            isCorrect = selected === correctAnswer;
        }

        const answerObj = {
            selected: selected,
            correct: isCorrect,
            answer: correctAnswer,
            question: questionText,
            marks: marks,
            total_marks: marks,
            code: code || "",
            lang: lang || 71,
            test_cases: testCases || [],
            hidden_test_cases: hiddenTestCases || [],
            type: questionType
        };

        answers[`q${num}`] = answerObj;
        answered.push(answerObj);
    });

    // Show loading indicator
    const submitBtn = document.querySelector('.submit-btn');
    const originalText = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = "Grading subjective answers with AI...";
    submitBtn.style.opacity = "0.6";

    try {
        // 🎯 SEND TO BACKEND FOR AI GRADING
        const response = await fetch("/api/ai_feedback_quiz", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                course: course || "general",
                answered: answered
            })
        });

        if (!response.ok) {
            throw new Error("Failed to grade answers");
        }

        const aiResult = await response.json();
        const feedback = aiResult.feedback || "No feedback provided.";

        // 🎯 USE AI-CORRECTED ANSWERS
        const correctedAnswers = aiResult.answers || answered;
        const finalScore = aiResult.score || 0;
        const finalTotal = aiResult.total_marks || totalMarks;
        const percentage = finalTotal > 0 ? (finalScore / finalTotal) * 100 : 0;

        if (classroomId && testRef) {
            try {
                // 🧠 Prepare the data to save in Firebase
                const updateData = {
                    status: "Completed",
                    score: finalScore,
                    total: finalTotal,
                    percentage: percentage.toFixed(2),
                    feedback: feedback
                };

                // ✅ Send to backend
                const resp = await fetch("/update_test_status", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        classroom_id: classroomId,
                        test_ref: testRef,
                        update_data: updateData
                    })
                });

                const result = await resp.json();
                if (result.success) {
                    console.log("✅ Result saved to Firebase successfully!");
                } else {
                    console.warn("⚠️ Failed to save result:", result.message);
                }
            } catch (err) {
                console.error("❌ Error saving result:", err);
            }
        }

        // Convert corrected answers back to the format result.html expects
        const answersForUrl = {};
        correctedAnswers.forEach((ans, i) => {
            answersForUrl[`q${i + 1}`] = ans;
        });

        // Navigate to results with AI-corrected data
        const params = new URLSearchParams({
            score: finalScore,
            total: finalTotal,
            percentage: percentage.toFixed(1),
            answers: JSON.stringify(answersForUrl),
            answered: JSON.stringify(correctedAnswers),
            course: course || "general",
            classroom: classroomId || "",
            test: testRef || "",
            ai_graded: "true"  // Flag to show AI was used
        });

        window.location.href = `/courses/result?${params.toString()}`;

    } catch (error) {
        console.error("Error grading answers:", error);
        
        // Fallback: use original client-side grading
        alert("AI grading unavailable. Using basic grading instead.");
        
        let earnedMarks = 0;
        answered.forEach(ans => {
            if (ans.correct) earnedMarks += ans.marks;
        });

        const percentage = totalMarks > 0 ? (earnedMarks / totalMarks) * 100 : 0;

        const params = new URLSearchParams({
            score: earnedMarks,
            total: totalMarks,
            percentage: percentage.toFixed(1),
            answers: JSON.stringify(answers),
            answered: JSON.stringify(answered),
            course: course || "general",
            classroom: classroomId || "",
            test: testRef || ""
        });

        window.location.href = `/courses/result?${params.toString()}`;
    }
}
</script>

</body>
</html>
