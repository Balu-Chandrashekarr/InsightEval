<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }
        .assessment-wrapper {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: grid;
            grid-template-columns: 200px 1fr;
            min-height: 70vh;
        }
        .question-nav {
            background-color: #f9fafb;
            padding: 20px;
            border-right: 1px solid #e0e7ff;
        }
        .question-nav ul {
            list-style: none;
            padding: 0;
        }
        .question-nav li {
            padding: 10px;
            cursor: pointer;
            color: #3b82f6;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .question-nav li:hover, .question-nav li.active {
            background-color: #e0e7ff;
            color: #2563eb;
            font-weight: 600;
            border-radius: 4px;
        }
        .question-nav li.answered {
            background-color: #d1fae5;
            color: #065f46;
            font-weight: 600;
        }
        .question-content {
            padding: 30px;
        }
        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            color: #1e40af;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e7ff;
        }
        .question {
            margin-bottom: 25px;
            display: none;
        }
        .question.active {
            display: block;
        }
        .question h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 15px;
        }
        .option {
            display: flex;
            align-items: center;
            margin: 10px 0;
            padding-left: 10px;
        }
        .option input[type="radio"] {
            margin-right: 12px;
            accent-color: #3b82f6;
            transform: scale(1.2);
        }
        .option label {
            font-size: 1rem;
            color: #4b5563;
        }
        .submit-btn {
            background-color: #3b82f6;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.3s ease;
            display: none; /* Hidden by default */
        }
        .submit-btn.visible {
            display: inline-block;
        }
        .submit-btn:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="assessment-wrapper">
            <div class="question-nav">
                <ul id="question-list"></ul>
            </div>
            <div class="question-content">
                <h1 id="course-title"></h1>
                <form id="assessment-form"></form>
            </div>
        </div>
    </div>

    <script>
  // Extract parameters
  const urlParams = new URLSearchParams(window.location.search);
  const course = urlParams.get('course')?.toLowerCase();
  const classroomId = urlParams.get('classroom');
  const testRef = urlParams.get('test');

  console.log("🧠 Classroom:", classroomId);
  console.log("🧩 Test Ref:", testRef);
  console.log("📚 Course:", course);

  // Map course to title and JSON file
  const courseTitles = {
      'dsa': 'Final Assessment: Data Structures and Algorithms',
      'oops': 'Final Assessment: Object-Oriented Programming',
      'dbms': 'Final Assessment: Database Management Systems',
      'os': 'Final Assessment: Operating Systems',
      'dmml': 'Final Assessment: Data Mining and Machine Learning'
  };
  const courseJson = {
      'dsa': '/json/dsa_questions.json',
      'oops': '/json/oops_questions.json',
      'dbms': '/json/dbms_questions.json',
      'os': '/json/os_questions.json',
      'dmml': '/json/dmml_questions.json'
  };

  // Set title placeholder
  document.getElementById('course-title').textContent = courseTitles[course];

  // =========================
  // MAIN LOADER FUNCTION
  // =========================
  async function loadQuestions() {
    if (classroomId && testRef) {
      // ✅ Case 1: Classroom Test (Backend Fetch)
      console.log("Fetching classroom test from backend...");
      try {
        const response = await fetch(`/get_test_data/${classroomId}/${testRef}`);
        const data = await response.json();

        if (!data.success) throw new Error(data.error || "Failed to fetch test data");
        const wrapper = data.test;
        const test = wrapper.test ? wrapper.test : wrapper;

        document.getElementById("course-title").textContent = test.title;
        renderQuestions(test.questions || []);
      } catch (err) {
        console.error("Error fetching test:", err);
        document.getElementById('assessment-form').innerHTML =
          '<p class="text-red-600">Error loading classroom test. Please try again later.</p>';
      }

    } else {
      // ✅ Case 2: Predefined course JSON
      console.log("Loading static course assessment...");
      try {
        const response = await fetch(courseJson[course]);
        if (!response.ok) throw new Error('Failed to load questions');
        const data = await response.json();

        const questions = data.questions;
        // Shuffle and select 20
        for (let i = questions.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [questions[i], questions[j]] = [questions[j], questions[i]];
        }
        const selected = questions.slice(0, 20);
        renderQuestions(selected);
      } catch (err) {
        console.error('Error loading static questions:', err);
        document.getElementById('assessment-form').innerHTML =
          '<p class="text-red-600">Error loading static questions.</p>';
      }
    }
  }

  loadQuestions();

  // =========================
  // RENDER FUNCTION
  // =========================
  function renderQuestions(questions) {
    if (!questions || questions.length === 0) {
      document.getElementById('assessment-form').innerHTML =
        '<p class="text-gray-600">No questions found.</p>';
      return;
    }

    const questionList = document.getElementById('question-list');
    const assessmentForm = document.getElementById('assessment-form');
    questionList.innerHTML = '';
    assessmentForm.innerHTML = '';

    questions.forEach((q, index) => {
      const num = index + 1;

      // Sidebar nav item
      const li = document.createElement('li');
      li.textContent = `Question ${num}`;
      li.dataset.index = index;
      li.addEventListener('click', () => {
        document.querySelectorAll('.question').forEach(q => q.classList.remove('active'));
        document.getElementById(`question-${index}`).classList.add('active');
        document.querySelectorAll('.question-nav li').forEach(li => li.classList.remove('active'));
        li.classList.add('active');
      });
      questionList.appendChild(li);

      // Question block
      const questionDiv = document.createElement('div');
      questionDiv.id = `question-${index}`;
      questionDiv.className = 'question';
      questionDiv.innerHTML = `
        <h3>${q.question}</h3>
        ${q.options.map((opt, i) => `
          <div class="option">
            <input type="radio" name="q${num}" value="${opt}" id="q${num}_opt${i}">
            <label for="q${num}_opt${i}">${opt}</label>
          </div>
        `).join('')}
      `;
      assessmentForm.appendChild(questionDiv);

      // Mark answered in sidebar
      questionDiv.querySelectorAll('input[type="radio"]').forEach(radio => {
        radio.addEventListener('change', () => {
          const navItem = questionList.children[index];
          if (!navItem.classList.contains('answered')) navItem.classList.add('answered');
        });
      });
    });

    // Show first question
    document.querySelector('.question')?.classList.add('active');
    questionList.firstChild?.classList.add('active');

    // Submit button on last question
    const last = document.getElementById(`question-${questions.length - 1}`);
    if (last) {
      const btn = document.createElement('button');
      btn.type = 'submit';
      btn.className = 'submit-btn visible';
      btn.textContent = 'Submit Assessment';
      last.appendChild(btn);
    }

    // Handle submission
    assessmentForm.addEventListener('submit', e => {
      e.preventDefault();
      handleSubmit(questions);
    });
  }

  // =========================
  // SUBMIT HANDLER
  // =========================
  function handleSubmit(questions) {
    let score = 0;
    const answers = {};
    questions.forEach((q, i) => {
      const num = i + 1;
      const selected = document.querySelector(`input[name="q${num}"]:checked`);
      if (selected && selected.value === q.answer) score++;
      answers[`q${num}`] = {
        selected: selected?.value || 'Not answered',
        correct: selected?.value === q.answer,
        answer: q.answer
      };
    });

    const percentage = (score / questions.length) * 100;

    const params = new URLSearchParams({
      score,
      percentage: percentage.toFixed(2),
      course,
      answers: JSON.stringify(answers)
    });

    // Redirect to results page
    window.location.href = `/courses/result?${params.toString()}`;
  }
</script>

</body>
</html>
