<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }
        .assessment-wrapper {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: grid;
            grid-template-columns: 200px 1fr;
            min-height: 70vh;
        }
        .question-nav {
            background-color: #f9fafb;
            padding: 20px;
            border-right: 1px solid #e0e7ff;
        }
        .question-nav ul {
            list-style: none;
            padding: 0;
        }
        .question-nav li {
            padding: 10px;
            cursor: pointer;
            color: #3b82f6;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .question-nav li:hover, .question-nav li.active {
            background-color: #e0e7ff;
            color: #2563eb;
            font-weight: 600;
            border-radius: 4px;
        }
        .question-nav li.answered {
            background-color: #d1fae5;
            color: #065f46;
            font-weight: 600;
        }
        .question-content {
            padding: 30px;
        }
        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            color: #1e40af;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e7ff;
        }
        .question {
            margin-bottom: 25px;
            display: none;
        }
        .question.active {
            display: block;
        }
        .question h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 15px;
        }
        .option {
            display: flex;
            align-items: center;
            margin: 10px 0;
            padding-left: 10px;
        }
        .option input[type="radio"] {
            margin-right: 12px;
            accent-color: #3b82f6;
            transform: scale(1.2);
        }
        .option label {
            font-size: 1rem;
            color: #4b5563;
        }
        .submit-btn {
            background-color: #3b82f6;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.3s ease;
            display: none; /* Hidden by default */
        }
        .submit-btn.visible {
            display: inline-block;
        }
        .submit-btn:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="assessment-wrapper">
            <div class="question-nav">
                <ul id="question-list"></ul>
            </div>
            <div class="question-content">
                <h1 id="course-title"></h1>
                <form id="assessment-form"></form>
            </div>
        </div>
    </div>

   <script>
  // Extract parameters
  const urlParams = new URLSearchParams(window.location.search);
  const course = urlParams.get('course')?.toLowerCase();
  const classroomId = urlParams.get('classroom');
  const testRef = urlParams.get('test');

  console.log("Classroom:", classroomId);
  console.log("Test Ref:", testRef);
  console.log("Course:", course);

  // Map course to title and JSON file
  const courseTitles = {
      'dsa': 'Final Assessment: Data Structures and Algorithms',
      'oops': 'Final Assessment: Object-Oriented Programming',
      'dbms': 'Final Assessment: Database Management Systems',
      'os': 'Final Assessment: Operating Systems',
      'dmml': 'Final Assessment: Data Mining and Machine Learning'
  };
  const courseJson = {
      'dsa': '/json/dsa_questions.json',
      'oops': '/json/oops_questions.json',
      'dbms': '/json/dbms_questions.json',
      'os': '/json/os_questions.json',
      'dmml': '/json/dmml_questions.json'
  };

  document.getElementById('course-title').textContent = courseTitles[course];

  // =========================
  // MAIN LOADER FUNCTION
  // =========================
  async function loadQuestions() {
    if (classroomId && testRef) {
      console.log("Fetching classroom test from backend...");
      try {
        const response = await fetch(`/get_test_data/${classroomId}/${testRef}`);
        const data = await response.json();
        if (!data.success) throw new Error(data.error || "Failed to fetch test data");
        const wrapper = data.test;
        const test = wrapper.test ? wrapper.test : wrapper;
        document.getElementById("course-title").textContent = test.title;
        renderQuestions(test.questions || []);
      } catch (err) {
        console.error("Error fetching test:", err);
        document.getElementById('assessment-form').innerHTML =
          '<p class="text-red-600">Error loading classroom test. Please try again later.</p>';
      }
    } else {
      console.log("Loading static course assessment...");
      try {
        const response = await fetch(courseJson[course]);
        if (!response.ok) throw new Error('Failed to load questions');
        const data = await response.json();
        const questions = data.questions;
        for (let i = questions.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [questions[i], questions[j]] = [questions[j], questions[i]];
        }
        const selected = questions.slice(0, 20);
        renderQuestions(selected);
      } catch (err) {
        console.error('Error loading static questions:', err);
        document.getElementById('assessment-form').innerHTML =
          '<p class="text-red-600">Error loading static questions.</p>';
      }
    }
  }

  loadQuestions();

  // =========================
  // RENDER FUNCTION (NOW SUPPORTS CODING QUESTIONS)
  // =========================
  function renderQuestions(questions) {
    if (!questions || questions.length === 0) {
      document.getElementById('assessment-form').innerHTML =
        '<p class="text-gray-600">No questions found.</p>';
      return;
    }

    const questionList = document.getElementById('question-list');
    const assessmentForm = document.getElementById('assessment-form');
    questionList.innerHTML = '';
    assessmentForm.innerHTML = '';

    questions.forEach((q, index) => {
      const num = index + 1;

      // Sidebar nav item
      const li = document.createElement('li');
      li.textContent = `Question ${num}`;
      li.dataset.index = index;
      li.addEventListener('click', () => {
        document.querySelectorAll('.question').forEach(q => q.classList.remove('active'));
        document.getElementById(`question-${index}`).classList.add('active');
        document.querySelectorAll('.question-nav li').forEach(li => li.classList.remove('active'));
        li.classList.add('active');
      });
      questionList.appendChild(li);

      // Question block
      const questionDiv = document.createElement('div');
      questionDiv.id = `question-${index}`;
      questionDiv.className = 'question';

      let questionHTML = '';

      if (q.type === "coding") {
        // CODING QUESTION
        questionHTML = `
          <h3 class="text-xl font-bold mb-6">${q.question || "Write a program to solve the following problem:"}</h3>
          <div class="bg-gray-900 rounded-lg overflow-hidden shadow-xl">
            <div class="bg-gray-800 px-4 py-3 flex justify-between items-center">
              <select id="lang-${index}" class="bg-gray-700 text-white text-sm rounded px-3 py-1">
                <option value="71">Python</option>
                <option value="62">Java</option>
                <option value="54">C++</option>
                <option value="63">JavaScript</option>
                <option value="52">C</option>
              </select>
              <button type="button" onclick="runCode(${index})" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded">
                Run Code
              </button>
            </div>
            <textarea id="code-${index}" class="w-full h-96 bg-gray-900 text-green-400 font-mono text-lg p-4 resize-none" 
                      placeholder="// Write your code here...">${q.template || ""}</textarea>
          </div>

          <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <h4 class="font-bold text-gray-700 mb-2">Input:</h4>
              <textarea id="input-${index}" class="w-full h-32 p-4 border rounded-lg font-mono text-sm" 
                        placeholder="Enter input...">${q.sample_input || ""}</textarea>
            </div>
            <div>
              <h4 class="font-bold text-gray-700 mb-2">Output:</h4>
              <pre id="output-${index}" class="bg-black text-green-400 p-4 rounded-lg h-32 overflow-auto font-mono text-sm">Click Run to see output</pre>
            </div>
          </div>

          <input type="hidden" id="coding-answer-${index}" name="q${num}">
        `;
      } else {
        // MCQ / SHORT ANSWER
        questionHTML = `
          <h3>${q.question}</h3>
          ${q.options ? q.options.map((opt, i) => `
            <div class="option">
              <input type="radio" name="q${num}" value="${opt}" id="q${num}_opt${i}">
              <label for="q${num}_opt${i}">${opt}</label>
            </div>
          `).join('') : 
          `<textarea name="q${num}" class="w-full p-4 border rounded-lg mt-4" rows="4" placeholder="Type your answer here..."></textarea>`
          }
        `;
      }

      questionDiv.innerHTML = questionHTML;
      assessmentForm.appendChild(questionDiv);

      // Mark answered in sidebar
      const inputs = questionDiv.querySelectorAll('input, textarea');
      inputs.forEach(input => {
        input.addEventListener('input', () => {
          const navItem = questionList.children[index];
          if (!navItem.classList.contains('answered')) navItem.classList.add('answered');
        });
      });
    });

    // Show first question
    document.querySelector('.question')?.classList.add('active');
    questionList.firstChild?.classList.add('active');

    // Submit button
    const last = document.getElementById(`question-${questions.length - 1}`);
    if (last) {
      const btn = document.createElement('button');
      btn.type = 'submit';
      btn.className = 'submit-btn visible mt-8';
      btn.textContent = 'Submit Assessment';
      last.appendChild(btn);
    }

    assessmentForm.addEventListener('submit', e => {
      e.preventDefault();
      handleSubmit(questions);
    });
  }

  // =========================
  // RUN CODE FUNCTION (Judge0)
  // =========================
  window.runCode = async function(index) {
    const code = document.getElementById(`code-${index}`).value;
    const lang = document.getElementById(`lang-${index}`).value;
    const input = document.getElementById(`input-${index}`).value;
    const outputEl = document.getElementById(`output-${index}`);

    outputEl.textContent = "Running...";
    outputEl.style.color = "#60a5fa";

    try {
      const res = await fetch('/run_code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, language_id: lang, input })
      });
      const result = await res.json();
      outputEl.textContent = result.output || "No output";
      outputEl.style.color = result.status === "Accepted" ? "#10b981" : "#ef4444";
    } catch (err) {
      outputEl.textContent = "Error: Could not connect to compiler";
      outputEl.style.color = "#ef4444";
    }
  };

  // =========================
  // SUBMIT HANDLER (Saves coding answers)
  // =========================
  function handleSubmit(questions) {
    let score = 0;
    const answers = {};

    questions.forEach((q, i) => {
      const num = i + 1;

      if (q.type === "coding" || (!q.options && q.answer)) {
        const codeEl = document.getElementById(`code-${i}`);
        const submittedCode = codeEl ? codeEl.value.trim() : "";
        const correct = submittedCode.length > 10; // Basic check (you can improve later)
        if (correct) score++;

        answers[`q${num}`] = {
          selected: submittedCode ? "Code submitted" : "Not answered",
          correct: correct,
          answer: q.answer || "Code accepted"
        };

        // Save code to hidden field
        const hidden = document.getElementById(`coding-answer-${i}`);
        if (hidden) hidden.value = submittedCode;
      } else {
        const selected = document.querySelector(`input[name="q${num}"]:checked`) || 
                        document.querySelector(`textarea[name="q${num}"]`);
        const value = selected ? selected.value.trim() : 'Not answered';
        const isCorrect = value === q.answer;
        if (isCorrect) score++;

        answers[`q${num}`] = {
          selected: value,
          correct: isCorrect,
          answer: q.answer
        };
      }
    });

    const percentage = (score / questions.length) * 100;

    const params = new URLSearchParams({
      score,
      percentage: percentage.toFixed(2),
      course,
      classroom: classroomId || '',
      test: testRef || '',
      answers: JSON.stringify(answers)
    });

    window.location.href = `/courses/result?${params.toString()}`;
  }
</script>

</body>
</html>
