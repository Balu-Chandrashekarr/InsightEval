<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment - InsightEval</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            color: #1e293b;
            min-height: 100vh;
            padding: 0;
        }

        .hero-section {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(96, 165, 250, 0.05) 100%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(59, 130, 246, 0.15);
            padding: 24px 40px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 50%, #60a5fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }

        .assessment-wrapper {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 0;
            max-width: 100%;
            margin: 0;
            min-height: calc(100vh - 100px);
        }

        .question-nav {
            background: white;
            border-right: 1px solid rgba(59, 130, 246, 0.15);
            padding: 30px 20px;
            position: sticky;
            top: 80px;
            height: calc(100vh - 80px);
            overflow-y: auto;
        }

        .question-nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .question-nav li {
            padding: 14px 18px;
            margin: 8px 0;
            cursor: pointer;
            color: #64748b;
            transition: all 0.2s ease;
            border-radius: 10px;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .question-nav li:hover {
            background-color: #eff6ff;
            color: #3b82f6;
        }

        .question-nav li.active {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .question-nav li.answered {
            background-color: #d1fae5;
            color: #065f46;
            font-weight: 600;
        }

        .question-nav li.answered.active {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .question-content {
            padding: 40px 60px;
            max-width: 1200px;
        }

        .question {
            display: none;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.15);
        }

        .question.active {
            display: block;
        }

        .question h3 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .marks-badge {
            display: inline-block;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .option {
            display: flex;
            align-items: center;
            margin: 12px 0;
            padding: 16px 20px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option:hover {
            border-color: #3b82f6;
            background: #eff6ff;
            transform: translateX(4px);
        }

        .option input[type="radio"] {
            margin-right: 14px;
            accent-color: #3b82f6;
            transform: scale(1.3);
            cursor: pointer;
        }

        .option label {
            font-size: 1rem;
            color: #475569;
            cursor: pointer;
            flex: 1;
        }

        textarea {
            width: 100%;
            padding: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            color: #1e293b;
            resize: vertical;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .code-editor-container {
            background: #1e293b;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin: 20px 0;
        }

        .code-editor-header {
            background: #334155;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .code-editor-header select {
            background: #1e293b;
            color: white;
            border: 1px solid #475569;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .run-code-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .run-code-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
        }

        .code-editor {
            width: 100%;
            min-height: 400px;
            background: #0f172a;
            color: #10b981;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            padding: 24px;
            border: none;
            resize: vertical;
        }

        .code-editor:focus {
            outline: none;
        }

        .io-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .io-box {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
        }

        .io-box h4 {
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 12px;
        }

        .io-box textarea {
            min-height: 120px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }

        .io-box pre {
            background: #0f172a;
            color: #10b981;
            padding: 16px;
            border-radius: 8px;
            min-height: 120px;
            overflow: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            margin: 0;
        }

        .submit-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            padding: 18px 48px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1.125rem;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
            display: none;
            margin-top: 40px;
        }

        .submit-btn.visible {
            display: inline-block;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(59, 130, 246, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        details {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
        }

        details summary {
            font-weight: 700;
            color: #1e293b;
            cursor: pointer;
            font-size: 1rem;
        }

        .test-case {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            margin-top: 12px;
        }

        @media (max-width: 1024px) {
            .assessment-wrapper {
                grid-template-columns: 1fr;
            }
            .question-nav {
                position: relative;
                height: auto;
                top: 0;
                border-right: none;
                border-bottom: 1px solid rgba(59, 130, 246, 0.15);
            }
            .question-content {
                padding: 30px 20px;
            }
        }

        @media (max-width: 768px) {
            h1 { font-size: 1.5rem; }
            .hero-section { padding: 20px; }
            .question { padding: 24px; }
            .io-panel { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="hero-section">
        <div style="max-width: 100%; margin: 0 auto;">
            <h1 id="course-title"></h1>
        </div>
    </div>

    <div class="assessment-wrapper">
        <div class="question-nav">
            <ul id="question-list"></ul>
        </div>
        <div class="question-content">
            <form id="assessment-form"></form>
        </div>
    </div>

   <script>
  // Extract parameters
  const urlParams = new URLSearchParams(window.location.search);
  const course = urlParams.get('course')?.toLowerCase();
  const classroomId = urlParams.get('classroom');
  const testRef = urlParams.get('test');

  console.log("Classroom:", classroomId);
  console.log("Test Ref:", testRef);
  console.log("Course:", course);

  // Map course to title and JSON file
  const courseTitles = {
      'dsa': 'Final Assessment: Data Structures and Algorithms',
      'oops': 'Final Assessment: Object-Oriented Programming',
      'dbms': 'Final Assessment: Database Management Systems',
      'os': 'Final Assessment: Operating Systems',
      'dmml': 'Final Assessment: Data Mining and Machine Learning'
  };
  const courseJson = {
      'dsa': '/json/dsa_questions.json',
      'oops': '/json/oops_questions.json',
      'dbms': '/json/dbms_questions.json',
      'os': '/json/os_questions.json',
      'dmml': '/json/dmml_questions.json'
  };

  document.getElementById('course-title').textContent = courseTitles[course];

  // =========================
  // MAIN LOADER FUNCTION
  // =========================
  async function loadQuestions() {

    if (classroomId && testRef) {
      console.log("Fetching classroom test from backend...");
      try {
        const response = await fetch(`/get_test_data/${classroomId}/${testRef}`);
        const data = await response.json();
        if (!data.success) throw new Error(data.error || "Failed to fetch test data");
        const wrapper = data.test;
        const test = wrapper.test ? wrapper.test : wrapper;
        document.getElementById("course-title").textContent = test.title;
        renderQuestions(test.questions || []);
      } catch (err) {
        console.error("Error fetching test:", err);
        document.getElementById('assessment-form').innerHTML =
          '<p class="text-red-600">Error loading classroom test. Please try again later.</p>';
      }
    } else {
      console.log("Loading static course assessment...");
      try {
        const response = await fetch(courseJson[course]);
        if (!response.ok) throw new Error('Failed to load questions');
        const data = await response.json();
        const questions = data.questions;
        for (let i = questions.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [questions[i], questions[j]] = [questions[j], questions[i]];
        }
        const selected = questions.slice(0, 20);
        renderQuestions(selected);
      } catch (err) {
        console.error('Error loading static questions:', err);
        document.getElementById('assessment-form').innerHTML =
          '<p class="text-red-600">Error loading static questions.</p>';
      }
    }
  }

  loadQuestions();

  // =========================
  // RENDER FUNCTION (NOW SUPPORTS CODING QUESTIONS)
  // =========================
  function renderQuestions(questions) {
    if (!questions || questions.length === 0) {
      document.getElementById('assessment-form').innerHTML =
        '<p class="text-gray-600">No questions found.</p>';
      return;
    }

    const questionList = document.getElementById('question-list');
    const assessmentForm = document.getElementById('assessment-form');
    questionList.innerHTML = '';
    assessmentForm.innerHTML = '';

    questions.forEach((q, index) => {
      const num = index + 1;

      // Sidebar nav item
      const li = document.createElement('li');
      li.textContent = `Question ${num}`;
      li.dataset.index = index;
      li.addEventListener('click', () => {
        document.querySelectorAll('.question').forEach(q => q.classList.remove('active'));
        document.getElementById(`question-${index}`).classList.add('active');
        document.querySelectorAll('.question-nav li').forEach(li => li.classList.remove('active'));
        li.classList.add('active');
      });
      questionList.appendChild(li);

      // Question block
      const questionDiv = document.createElement('div');
      questionDiv.id = `question-${index}`;
      questionDiv.className = 'question';

      let questionHTML = '';

      if (q.type === "coding") {
      // CODING QUESTION
      const visibleCases = q.test_cases || [];
      const sampleCasesHTML = visibleCases.length > 0
        ? `
          <details style="margin-top: 30px;">
            <summary>📘 View Sample Test Cases</summary>
            <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 12px;">
              ${visibleCases.map((tc, i) => `
                <div class="test-case">
                  <p style="font-size: 0.875rem; color: #64748b; font-weight: 600;">Test Case ${i + 1}</p>
                  <p style="font-size: 0.875rem; margin-top: 8px;"><b>Input:</b></p>
                  <pre style="background: #f1f5f9; color: #1e293b; padding: 12px; border-radius: 6px; font-size: 0.875rem; margin: 4px 0;">${tc.stdin}</pre>
                  <p style="font-size: 0.875rem; margin-top: 8px;"><b>Expected Output:</b></p>
                  <pre style="background: #f1f5f9; color: #1e293b; padding: 12px; border-radius: 6px; font-size: 0.875rem; margin: 4px 0;">${tc.expected}</pre>
                </div>
              `).join("")}
            </div>
          </details>
        `
        : "";

      questionHTML = `
        <h3>${q.question || "Solve the following coding problem:"}</h3>
        <span class="marks-badge">📝 Marks: ${q.marks || 10}</span>

        <!-- CODE EDITOR -->
        <div class="code-editor-container">
          <div class="code-editor-header">
            <select id="lang-${index}">
              <option value="71">Python</option>
              <option value="62">Java</option>
              <option value="54">C++</option>
              <option value="63">JavaScript</option>
              <option value="52">C</option>
            </select>
            <button type="button" onclick="runCode(${index})" class="run-code-btn">
              ▶ Run Code
            </button>
          </div>
          <textarea id="code-${index}" class="code-editor" placeholder="// Write your code here...">${q.template || ""}</textarea>
        </div>

        <!-- INPUT / OUTPUT PANEL -->
        <div class="io-panel">
          <div class="io-box">
            <h4>Input:</h4>
            <textarea id="input-${index}" placeholder="Enter custom input...">${q.sample_input || ""}</textarea>
          </div>
          <div class="io-box">
            <h4>Output:</h4>
            <pre id="output-${index}">Click Run to see output</pre>
          </div>
        </div>

        ${sampleCasesHTML}
        <input type="hidden" id="coding-answer-${index}" name="q${num}">
      `;
    }  else {
        // MCQ / SHORT ANSWER
        questionHTML = `
          <h3>${q.question}</h3>
          <span class="marks-badge">📝 Marks: ${q.marks || 1}</span>
          ${q.options ? q.options.map((opt, i) => `
            <div class="option">
              <input type="radio" name="q${num}" value="${opt}" id="q${num}_opt${i}">
              <label for="q${num}_opt${i}">${opt}</label>
            </div>
          `).join('') : 
          `<textarea name="q${num}" rows="6" placeholder="Type your answer here..."></textarea>`
          }
        `;
      }

      questionDiv.innerHTML = questionHTML;
      assessmentForm.appendChild(questionDiv);

      // Mark answered in sidebar
      const inputs = questionDiv.querySelectorAll('input, textarea');
      inputs.forEach(input => {
        input.addEventListener('input', () => {
          const navItem = questionList.children[index];
          if (!navItem.classList.contains('answered')) navItem.classList.add('answered');
        });
      });
    });

    // Show first question
    document.querySelector('.question')?.classList.add('active');
    questionList.firstChild?.classList.add('active');

    // Submit button
    const last = document.getElementById(`question-${questions.length - 1}`);
    if (last) {
      const btn = document.createElement('button');
      btn.type = 'submit';
      btn.className = 'submit-btn visible';
      btn.textContent = '✓ Submit Assessment';
      last.appendChild(btn);
    }

    assessmentForm.addEventListener('submit', e => {
      e.preventDefault();
      handleSubmit(questions);
    });
  }

  // =========================
  // RUN CODE FUNCTION (Judge0)
  // =========================
  window.runCode = async function(index) {
    const code = document.getElementById(`code-${index}`).value;
    const lang = document.getElementById(`lang-${index}`).value;
    const input = document.getElementById(`input-${index}`).value;
    const outputEl = document.getElementById(`output-${index}`);

    outputEl.textContent = "⏳ Running...";
    outputEl.style.color = "#60a5fa";

    try {
      const res = await fetch('/run_code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, language_id: lang, input })
      });
      const result = await res.json();
      outputEl.textContent = result.output || "No output";
      outputEl.style.color = result.status === "Accepted" ? "#10b981" : "#ef4444";
    } catch (err) {
      outputEl.textContent = "❌ Error: Could not connect to compiler";
      outputEl.style.color = "#ef4444";
    }
  };

 // =========================
// SUBMIT HANDLER
// =========================
async function handleSubmit(questions) {
    let totalMarks = 0;
    const answers = {};
    const answered = [];

    // Collect all answers (including short answers that need AI grading)
    questions.forEach((q, i) => {
        const num = i + 1;
        const marks = q.marks || 1;
        totalMarks += marks;

        let selected = "Not answered";
        let code = "";
        let lang = "";
        let testCases = [];
        let hiddenTestCases = [];
        let correctAnswer = q.answer || "N/A";
        let isCorrect = false;
        const questionType = (q.type || "mcq").toLowerCase();
        const questionText = q.question || "No question text";

        if (questionType === "coding") {
            const codeEl = document.getElementById(`code-${i}`);
            const langEl = document.getElementById(`lang-${i}`);
            code = codeEl ? codeEl.value.trim() : "";
            lang = langEl ? langEl.value : "71";

            selected = code ? code : "Not answered";
            correctAnswer = q.expected_output || "Correct code execution expected";
            isCorrect = false;

            testCases = q.test_cases || [];
            hiddenTestCases = q.hidden_test_cases || [];
        } else if (questionType === "short_answer") {
            const textarea = document.querySelector(`textarea[name="q${num}"]`);
            selected = textarea?.value.trim() || "Not answered";
            correctAnswer = q.answer || "N/A";
            isCorrect = false;

        } else {
            // MCQ
            const checked = document.querySelector(`input[name="q${num}"]:checked`);
            selected = checked ? checked.value.trim() : "Not answered";
            correctAnswer = q.answer || "N/A";
            isCorrect = selected === correctAnswer;
        }

        const answerObj = {
            selected: selected,
            correct: isCorrect,
            answer: correctAnswer,
            question: questionText,
            marks: marks,
            total_marks: marks,
            code: code || "",
            lang: lang || 71,
            test_cases: testCases || [],
            hidden_test_cases: hiddenTestCases || [],
            type: questionType
        };

        answers[`q${num}`] = answerObj;
        answered.push(answerObj);
    });

    // Show loading indicator
    const submitBtn = document.querySelector('.submit-btn');
    const originalText = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = "Grading and getting feedback from AI...";
    submitBtn.style.opacity = "0.6";

    try {
        // SEND TO BACKEND FOR AI GRADING
        const response = await fetch("/api/ai_feedback_quiz", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                course: course || "general",
                answered: answered
            })
        });

        if (!response.ok) {
            throw new Error("Failed to grade answers");
        }

        const aiResult = await response.json();
        const feedback = aiResult.feedback || "No feedback provided.";
        const micro_quiz = aiResult.micro_quiz || [];

        // USE AI-CORRECTED ANSWERS
        const correctedAnswers = aiResult.answers || answered;
        const finalScore = aiResult.score || 0;
        const finalTotal = aiResult.total_marks || totalMarks;
        const percentage = finalTotal > 0 ? (finalScore / finalTotal) * 100 : 0;

        if (classroomId && testRef) {
            try {
                const updateData = {
                    status: "Completed",
                    score: finalScore,
                    total: finalTotal,
                    percentage: percentage.toFixed(2),
                    feedback: feedback
                };

                const resp = await fetch("/update_test_status", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        classroom_id: classroomId,
                        test_ref: testRef,
                        update_data: updateData
                    })
                });

                const result = await resp.json();
                if (result.success) {
                    console.log("✅ Result saved to Firebase successfully!");
                } else {
                    console.warn("⚠️ Failed to save result:", result.message);
                }
            } catch (err) {
                console.error("❌ Error saving result:", err);
            }
        } else {
            try {
                const starsData = {
                    marks: finalScore,
                    course_id: course
                };

                const starResp = await fetch("/api/store_stars", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(starsData)
                });

                const starResult = await starResp.json();
                if (starResult.success) {
                    console.log(`⭐ Stored ${starResult.stars} stars successfully!`);
                } else {
                    console.warn("⚠️ Failed to store stars:", starResult.error);
                }
            } catch (err) {
                console.error("❌ Error storing stars:", err);
            }
        }

        const answersForUrl = {};
        correctedAnswers.forEach((ans, i) => {
            answersForUrl[`q${i + 1}`] = ans;
        });

        const resultData = {
            score: finalScore,
            total: finalTotal,
            percentage: percentage.toFixed(1) || "0.0",
            answers: answersForUrl || answers,
            answered: correctedAnswers || [],
            course: course || "general",
            classroom: classroomId || "",
            test: testRef || "",
            feedback : feedback|| "No feedback provided.",
            micro_quiz: micro_quiz|| [],
            ai_graded: true
        };

        const saveResp = await fetch("/save_result_data", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(resultData)
        });

        const saveJson = await saveResp.json();

        if (saveJson.success && saveJson.result_id) {
            window.location.href = `/courses/result?id=${saveJson.result_id}`;
        } else {
            alert("Failed to save result data.");
        }

    } catch (error) {
    console.error("❌ Error grading answers:", error);
    alert("AI grading unavailable. Using basic grading instead.");

    let earnedMarks = 0;
    answered.forEach(ans => {
        if (ans.correct) earnedMarks += ans.marks;
    });

    const percentage = totalMarks > 0 ? (earnedMarks / totalMarks) * 100 : 0;

    const fallbackData = {
        score: earnedMarks,
        total: totalMarks,
        percentage: percentage.toFixed(1),
        answers: answers,
        answered: answered,
        course: course || "general",
        classroom: classroomId || "",
        test: testRef || "",
        micro_quiz: [],
        ai_graded: false,
        feedback: "AI grading unavailable. This score is based on automatic MCQ evaluation only."
    };

    try {
        const saveResp = await fetch("/save_result_data", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(fallbackData)
        });
        
        const saveJson = await saveResp.json();

        if (saveJson.success && saveJson.result_id) {
            window.location.href = `/courses/result?id=${saveJson.result_id}`;
        } else {
            throw new Error("Failed to save fallback result");
        }
    } catch (err2) {
        console.error("Fallback result saving failed:", err2);
        alert("Something went wrong saving your result. Please try again.");
    }
}

}
</script>
