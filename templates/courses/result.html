<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InsightEval - Test Result</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            color: #1e293b;
            min-height: 100vh;
            padding: 0;
        }
        
        .hero-section {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(96, 165, 250, 0.05) 100%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(59, 130, 246, 0.15);
            padding: 60px 40px;
            margin-bottom: 0;
        }
        
        .container { 
            max-width: 100%; 
            margin: 0; 
            padding: 0;
        }
        
        .content-wrapper {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 40px 60px 40px;
        }
        
        .result-header {
            text-align: center;
            max-width: 1600px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 50%, #60a5fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }
        
        .score-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin: 50px 0;
        }
        
        .score-card {
            background: white;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(59, 130, 246, 0.15);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.08);
        }
        
        .score-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.25);
        }
        
        .score-circle {
            width: 200px; 
            height: 200px;
            border-radius: 50%;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            margin: 0 auto 30px;
            font-weight: 900;
            box-shadow: 0 10px 40px rgba(59, 130, 246, 0.2);
            position: relative;
        }
        
        .score-text {
            color: rgb(0, 0, 0) !important; 
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
            line-height: 1;
        }
        
        .back-btn, .micro-btn {
            padding: 16px 40px;
            border-radius: 16px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            margin: 10px;
            display: inline-block;
            font-size: 16px;
            border: 2px solid transparent;
        }
        
        .back-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            box-shadow: 0 10px 30px rgba(59, 131, 246, 0.3);
        }
        
        .back-btn:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 15px 40px rgba(59, 131, 246, 0.5);
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        .micro-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }
        
        .micro-btn:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 15px 40px rgba(59, 130, 246, 0.4);
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        .ai-section {
            margin-top: 60px;
            padding: 50px;
            background: white;
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(59, 130, 246, 0.15);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.08);
        }
        
        .section-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .loading { 
            color: #64748b; 
            font-style: italic; 
            text-align: center; 
            padding: 30px;
            font-size: 18px;
        }
        
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .hero-section { padding: 40px 20px; }
            .content-wrapper { padding: 0 20px 40px 20px; }
            .score-section { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero-section">
            <div class="result-header">
                <h1 id="result-title">Test Result</h1>
                <p class="text-xl text-slate-600 opacity-90" id="subtitle"></p>
            </div>
        </div>

        <div class="content-wrapper">
            <div id="main-content"></div>

            <div id="ai-section" class="ai-section hidden">
                <h3 class="section-title">🤖 AI-Powered Learning Insights</h3>
                <div id="feedback-loading" class="loading">Analyzing your performance with AI...</div>
                <div id="feedback-text" class="mt-6 text-lg text-slate-700 leading-relaxed"></div>
                <div class="text-center">
                    <button id="start-micro" class="micro-btn hidden" style="margin-top: 50px;">
                        Start Personalized Micro-Quiz
                    </button>
                </div>
                <button id="retry-ai-btn" class="micro-btn" 
                style="opacity: 0; transition: opacity 0.3s;" onclick="retryAiFeedback()">
                    Retry AI Feedback
                </button>
            </div>

            <div class="text-center mt-16">
                <a href="/dashboard" class="back-btn">← Back to Dashboard</a>
            </div>
        </div>
    </div>

<script>
document.addEventListener("DOMContentLoaded", async function () {
    const params = new URLSearchParams(window.location.search);
    const resultId = params.get("id");

    if (!resultId) {
        document.body.innerHTML = "<p class='text-center text-red-600 text-lg mt-20'>No result ID found.</p>";
        return;
    }

    const mainContent = document.getElementById('main-content');
    const aiSection = document.getElementById('ai-section');

    try {
        // 🧠 Fetch saved result data from backend
        const response = await fetch(`/api/get_result/${resultId}`);
        console.log("reached here111");
        if (!response.ok) throw new Error("Failed to load result data");

        const data = await response.json();
        console.log("✅ Result data loaded:", data);
        console.log("Reached here");
        renderResult(data);

    } catch (err) {
        console.error("❌ Error loading result:", err);
        document.body.innerHTML = "<p class='text-center text-red-600 text-lg mt-20'>Error loading hlo hlo result data.</p>";
    }

});
    async function retryAiFeedback() {
        // 🔹 For now, just a placeholder alert

            try {
            // Call backend to get stored answers
            const RetryResponse = await fetch("/api/retry_ai_feedback", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ course: window.course }) // use global course
            });

            if (!RetryResponse.ok) throw new Error("Failed to fetch retry data");

            

            const retryData = await RetryResponse.json();
            const answered = retryData.answered || [];
            console.log("✅ Retrieved answered data:", answered);

            // 2️⃣ Send retrieved answers for AI grading
            const aiResponse = await fetch("/api/ai_feedback_quiz", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    course: window.course || "general",
                    answered: answered
                })
            });

            if (!aiResponse.ok) throw new Error("Failed to grade answers");

            const aiResult = await aiResponse.json();
            console.log("✅ AI grading result:", aiResult);
            const correctedAnswers = aiResult.answers || [];
            const finalScore = aiResult.score || 0;
            const finalTotal = aiResult.total_marks || totalMarks;
            const percentage = finalTotal > 0 ? (finalScore / finalTotal) * 100 : 0;
            const answersForUrl = {};
            correctedAnswers.forEach((ans, i) => {
                answersForUrl[`q${i + 1}`] = ans;
            });
            const feedback = aiResult.feedback || "No feedback provided.";
            const micro_quiz = aiResult.micro_quiz || [];

            const resultData = {
                score: finalScore || 0,
                total: finalTotal || 0,
                percentage: percentage.toFixed(1) || "0.0",
                answers: answersForUrl || {},
                answered: correctedAnswers || [],
                course: window.course || "general",
                classroom: window.classroomId || "",
                test: window.testRef || "",
                feedback : feedback|| "No feedback provided.",
                micro_quiz: micro_quiz|| [],
                ai_graded: true
           };

           renderResult(resultData);

            // Optionally, you can now call your AI again using this data
            // or call renderResult() if your backend returns full result data
            // renderResult(data);

        } catch (err) {
            console.error(err);
            alert("Failed to retry AI feedback.");
        } 


            
    }
    function renderResult(data) {
        const mainContent = document.getElementById('main-content');
        const aiSection = document.getElementById('ai-section');
        console.log("error in render");

        // 🧠 Store course globally so it can be reused elsewhere
        window.course = data.course || "GENERAL";
        window.classroomId = data.classroom || "";
        window.testRef = data.test || "";

        console.log("Error in render1");

        // Extract data from backend response
        const earnedMarks = data.score || 0;
        const totalMarks = data.total || data.total_marks || 0;
        const percentage = totalMarks > 0 ? (earnedMarks / totalMarks) * 100 : 0;
        const answers = data.answers || {};
        const feedback = data.feedback || "No feedback available.";
        const microQuiz = data.micro_quiz || { questions: [] };

        const isClassroomTest = !!data.classroom && !!data.test;

        console.log("Error in data section");

        // 🎨 Visuals and tone setup
        const bgColor =
            percentage >= 90 ? 'from-emerald-500 to-teal-500' :
            percentage >= 70 ? 'from-blue-600 to-blue-500' :
            percentage >= 50 ? 'from-amber-500 to-orange-500' :
            'from-rose-500 to-red-500';

        const perf =
            percentage >= 90 ? { text: "🏆 Outstanding! You're a Top Performer!", color: "text-emerald-600" } :
            percentage >= 70 ? { text: "✨ Excellent Work! You Passed with Flying Colors!", color: "text-blue-600" } :
            percentage >= 50 ? { text: "👍 Good Effort! You Passed", color: "text-amber-600" } :
            { text: "💪 Keep Practicing – You'll Get There!", color: "text-rose-600" };

        // 🧩 Update page content
        document.getElementById('result-title').textContent = isClassroomTest 
            ? "Classroom Test Completed!"
            : "Assessment Result";

        document.getElementById('subtitle').textContent = isClassroomTest 
            ? "This test was created by your instructor"
            : "Review your performance and insights below";

        // 🧩 Render the main result section
        mainContent.innerHTML = `
            <div class="score-section">
                <div class="score-card">
                    <div class="score-circle bg-gradient-to-br ${bgColor}">
                        <div class="text-7xl font-black score-text">${earnedMarks}</div>
                        <div class="text-2xl score-text" style="opacity: 0.9;">/ ${totalMarks}</div>
                    </div>
                    <div class="text-xl font-bold text-slate-700">Total Score</div>
                </div>

                <div class="score-card" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
                    <div class="text-8xl font-black text-slate-800" style="line-height: 1;">${percentage.toFixed(1)}%</div>
                    <p class="text-2xl font-bold mt-6 ${perf.color}">${perf.text}</p>
                </div>
            </div>
        `;

        // 🧠 Show AI section with feedback
        document.getElementById('feedback-loading').classList.add('hidden');
        document.getElementById('feedback-text').textContent = feedback.replace(/\n/g, "\n\n");
        aiSection.classList.remove('hidden');

        // 🎯 Micro quiz button handler
        const microBtn = document.getElementById('start-micro');
        if (microQuiz?.questions?.length >= 5) {
            microBtn.classList.remove('hidden');
            microBtn.onclick = () => {
                localStorage.setItem('microQuiz', JSON.stringify(microQuiz.questions));
                location.href = '/micro_quiz';
            };
        }
    }


</script>

</body>
</html>
