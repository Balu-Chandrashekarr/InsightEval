<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InsightEval - Classroom View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body{
            /*background: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');*/
            background: linear-gradient(135deg, #fff7e1 0%, #ffe9b3 50%, #ffd280 100%);

        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .message-box-popup {
            transition: all 0.3s ease-out;
            transform: translateY(100%);
            opacity: 0;
        }
        .message-box-popup.show {
            transform: translateY(0);
            opacity: 1;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .request-item {
            transition: all 0.3s ease;
        }
        .request-item.removing {
            opacity: 0;
            transform: translateX(-20px);
        }
        .notification-dropdown {
            transform: translateY(-10px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .notification-dropdown.show {
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
        }
        .tab-badge {
            @apply absolute -top-1 -right-2 h-5 w-5 bg-red-500 text-white text-xs rounded-full flex items-center justify-center font-bold;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <main class="p-8 w-full h-screen flex flex-col">
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 id="classroom-name" class="text-3xl font-bold text-gray-800"></h1>
                <p id="subcode" class="text-md text-gray-600"></p>
            </div>

            <!-- NOTIFICATION BELL (ONLY) -->
            <div class="relative">
                <button id="notification-bell" class="relative p-2 rounded-full hover:bg-gray-100 transition-colors">
                   <i id="notibell" class="fas fa-bell text-gray-600 text-lg"></i>
                    <span id="notification-badge" class="absolute -top-1 -right-1 h-5 w-5 bg-red-500 text-white text-xs rounded-full flex items-center justify-center font-bold">2</span>
                </button>
                <div id="notification-dropdown" class="notification-dropdown absolute right-0 mt-2 w-80 bg-white rounded-xl shadow-xl border border-gray-200 z-50">
                    <div class="p-4 border-b border-gray-100">
                        <h3 class="font-bold text-gray-800">Notifications</h3>
                    </div>
                    <div id="notification-list" class="max-h-96 overflow-y-auto">
                        <!-- JS fills -->
                    </div>
                    <div class="p-3 border-t border-gray-100 text-center">
                        <a href="#" class="text-sm text-blue-600 hover:underline">View all</a>
                    </div>
                </div>
            </div>
        </header>

        <div class="flex gap-8 flex-1 overflow-hidden">
            <!-- Left: Feed -->
            <div class="flex-1 flex flex-col">
                <div id="classroom-feed" class="space-y-6 overflow-y-auto flex-1 pr-4">
                    <!-- Posts -->
                </div>

                <!-- Message Box -->
                <div class="mt-6 relative">
                    <div class="bg-white rounded-full shadow-lg p-2 flex items-center gap-2">
                        <div class="relative">
                            <button id="plus-btn" class="h-10 w-10 bg-gray-200 rounded-full flex items-center justify-center hover:bg-gray-300 transition-colors">
                                <i class="fas fa-plus text-gray-600"></i>
                            </button>
                            <div id="plus-popup" class="message-box-popup absolute bottom-14 left-0 bg-white rounded-lg shadow-xl p-2 w-48 hidden">
                                <a id="create-test-link" class="flex items-center gap-3 p-2 rounded-md hover:bg-gray-100">
                                    <i class="fas fa-file-alt text-blue-500"></i>
                                    <span class="font-semibold">Create Test</span>
                                </a>
                                <label class="flex items-center gap-3 p-2 rounded-md hover:bg-gray-100 cursor-pointer">
                                    <i class="fas fa-paperclip text-green-500"></i>
                                    <span class="font-semibold">Study Material</span>
                                    <input type="file" id="material-upload" class="hidden">
                                </label>
                            </div>
                        </div>
                        <textarea id="message-input" placeholder="Enter a message..." rows="1" class="flex-1 bg-transparent p-2 resize-none focus:outline-none text-gray-800"></textarea>
                        <button id="send-btn" class="h-10 w-10 bg-blue-500 rounded-full flex items-center justify-center hover:bg-blue-600 transition-colors">
                            <i class="fas fa-arrow-up text-white"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right: Sidebar (320px) -->
            <div class="w-96">
                <div class="group relative bg-white rounded-2xl shadow-md hover:shadow-xl transition-all duration-300 border border-gray-100 overflow-hidden h-full flex flex-col">
                    <div id="neon-bar" class="absolute top-0 left-0 w-1.5 h-full opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>

                    <!-- TABS -->
                    <div class="flex border-b border-gray-200 relative">
                        <button id="tab-members" class="flex-1 py-3 text-sm font-semibold text-gray-700 border-b-2 border-transparent hover:text-blue-600 transition-colors">
                            Members
                        </button>
                        <button id="tab-requests" class="flex-1 py-3 text-sm font-semibold text-gray-700 border-b-2 border-transparent hover:text-purple-600 transition-colors hidden relative">
                            Requests
                            <span id="requests-badge" class="tab-badge hidden"></span>
                        </button>
                    </div>

                    <!-- CONTENT -->
                    <div class="flex-1 overflow-y-auto p-6">
                        <!-- Members -->
                        <div id="content-members" class="tab-content active space-y-6">
                            <div>
                                <h3 class="font-semibold text-purple-700 mb-3 text-sm tracking-wider">TEACHER</h3>
                                <div class="flex items-center space-x-3 member-entry">
                                    <div class="w-9 h-9 rounded-full ml-3 bg-gradient-to-br from-blue-400 to-purple-500 flex items-center justify-center text-white text-sm font-bold member-initial"></div>
                                    <span class="member-name font-semibold text-gray-700">teacher_insightEval</span>
                                </div>
                            </div>
                            <div>
                                <h3 class="font-semibold text-blue-700 mb-3 mt-5 text-sm tracking-wider">STUDENTS</h3>
                                <div id="student-list" class="space-y-3">
                                    <!-- All students shown, no "View all" -->
                                </div>
                            </div>
                        </div>

                        <!-- Requests -->
                        <div id="content-requests" class="tab-content space-y-3">
                            <div id="requests-container"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
        <script>
        //Global variables
        window.c_user={};
        window.classroom_details = JSON.parse(localStorage.getItem('selectedClassroom')) || {};
        window.classroomId = window.location.pathname.split('/').pop();

        
        document.addEventListener('DOMContentLoaded', function() {
            // === USER & DATA ===
            //const pathParts = window.location.pathname.split('/');
            //const classroomId = pathParts[pathParts.length - 1];
            
            if (!classroom_details) {
                console.error("No classroom data found in localStorage");
                return;
            }
            const user_email = classroom_details.userEmail || "";
            const owner_email = classroom_details.ownerEmail || "";
            c_user.user_name = classroom_details.owner || "Unknown User";
            if (user_email === owner_email) {
                c_user.user_name = "You"
            }
            document.getElementById("classroom-name").textContent = classroom_details.name || "Untitled Class";
            document.getElementById("subcode").textContent = classroom_details.subjectCode+" | "+c_user.user_name || "yxt-000 | Unknown";

          
            // Demo join requests
            let joinRequests = [];
            async function loadJoinRequests() {
                try {
                    const resp = await fetch(`/get_join_requests/${classroomId}`);
                    if (!resp.ok) throw new Error('Failed to load join requests');

                    const data = await resp.json();
                    joinRequests = data.map((req, index) => ({
                        id: index + 1,
                        name: req.name,
                        email: req.email,
                        avatar: req.name.charAt(0).toUpperCase()
                    }));

                    renderRequests();
                    updateRequestsBadge();
                } catch (err) {
                    console.error('Error loading join requests:', err);
                }
            }


            // === NOTIFICATIONS (NO JOIN REQUESTS) ===
            let notifications = [
                { id: 1, type: 'assignment', message: 'Assignment #3 due tomorrow', time: '1 hour ago', read: false },
                { id: 2, type: 'post', message: 'New announcement posted', time: '3 hours ago', read: false }
            ];

            const notificationBell = document.getElementById('notification-bell');
            const notificationDropdown = document.getElementById('notification-dropdown');
            const notificationList = document.getElementById('notification-list');
            const notificationBadge = document.getElementById('notification-badge');

            function updateNotificationBadge() {
                const unread = notifications.filter(n => !n.read).length;
                notificationBadge.textContent = unread;
                notificationBadge.style.display = unread > 0 ? 'flex' : 'none';
            }

            function renderNotifications() {
                if (notifications.length === 0) {
                    notificationList.innerHTML = `<p class="p-4 text-center text-sm text-gray-500">No notifications</p>`;
                    return;
                }
                notificationList.innerHTML = notifications.map(notif => `
                    <div class="notification-item p-4 border-b border-gray-100 hover:bg-gray-50 cursor-pointer ${!notif.read ? 'bg-blue-50' : ''}" data-id="${notif.id}">
                        <div class="flex items-start space-x-3">
                            <div class="mt-1">
                                ${notif.type === 'assignment' ? '<i class="fas fa-clipboard-list text-red-600"></i>' : 
                                  '<i class="fas fa-bullhorn text-blue-600"></i>'}
                            </div>
                            <div class="flex-1">
                                <p class="text-sm font-medium text-gray-800">${notif.message}</p>
                                <p class="text-xs text-gray-500">${notif.time}</p>
                            </div>
                            ${!notif.read ? '<div class="w-2 h-2 bg-blue-600 rounded-full"></div>' : ''}
                        </div>
                    </div>
                `).join('');
            }

            notificationBell.addEventListener('click', (e) => {
                e.stopPropagation();
                notificationDropdown.classList.toggle('show');
            });

            window.addEventListener('click', () => {
                if (notificationDropdown.classList.contains('show')) {
                    notificationDropdown.classList.remove('show');
                }
            });

            notificationList.addEventListener('click', function(e) {
                const item = e.target.closest('.notification-item');
                if (!item) return;
                const id = parseInt(item.dataset.id);
                const notif = notifications.find(n => n.id === id);
                if (notif && !notif.read) {
                    notif.read = true;
                    updateNotificationBadge();
                    renderNotifications();
                }
            });

            updateNotificationBadge();
            renderNotifications();

            // === RANDOM NEON ===
            function randomNeon() {
                const neons = [
                    'from-pink-400 to-rose-500',
                    'from-cyan-400 to-blue-500',
                    'from-emerald-400 to-teal-500',
                    'from-purple-400 to-indigo-500',
                    'from-orange-400 to-red-500',
                    'from-lime-400 to-green-500',
                    'from-fuchsia-400 to-purple-500'
                ];
                return neons[Math.floor(Math.random() * neons.length)];
            }

            const neonGradient = randomNeon();
            document.getElementById('neon-bar').className = `absolute top-0 left-0 w-1.5 h-full bg-gradient-to-b ${neonGradient} opacity-0 group-hover:opacity-100 transition-opacity duration-500`;
            document.getElementById('notibell').className = `fas fa-bell text-lg bg-gradient-to-r ${neonGradient} bg-clip-text text-transparent`;

            // === TABS & RED BADGE ON REQUESTS ===
            const tabMembers = document.getElementById('tab-members');
            const tabRequests = document.getElementById('tab-requests');
            const contentMembers = document.getElementById('content-members');
            const contentRequests = document.getElementById('content-requests');
            const requestsContainer = document.getElementById('requests-container');
            const requestsBadge = document.getElementById('requests-badge');

            function updateRequestsBadge() {
                const count = joinRequests.length;
                requestsBadge.textContent = count;
                requestsBadge.classList.toggle('hidden', count === 0);
            }

            fetchMembers();

            if (user_email === owner_email) {
                tabRequests.classList.remove('hidden');
                loadJoinRequests();
            }

            function renderRequests() {
                if (joinRequests.length === 0) {
                    requestsContainer.innerHTML = `<p class="text-sm text-gray-500 italic">No pending join requests.</p>`;
                    return;
                }
                requestsContainer.innerHTML = joinRequests.map(req =>`
        <div class="request-item group flex items-center justify-between p-5 bg-white rounded-2xl border border-gray-100 hover:border-gray-200 transition-all duration-300">
            
            <!-- Left: Avatar + Info -->
            <div class="flex items-center space-x-4 flex-1 min-w-0">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-orange-400 to-red-500 flex items-center justify-center text-white text-sm font-bold shadow-sm">
                    ${req.avatar}
                </div>
                <div class="min-w-0">
                    <p class="text-xs font-medium text-gray-700 truncate">${req.name}</p>
                    <p class="email-textfeild text-xs text-gray-400 truncate">${req.email}</p>
                </div>
            </div>

            <!-- Right: Tick / X Buttons -->
            <div class="flex items-center gap-2">
                <button class="accept-btn p-2 rounded-full bg-green-50 hover:bg-green-100 text-green-600 transition-all duration-200 group-hover:scale-110" title="accept" data-id="${req.id}">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                    </svg>
                </button>
                <button class="decline-btn p-2 rounded-full bg-red-50 hover:bg-red-100 text-red-600 transition-all duration-200 group-hover:scale-110" title="reject" data-id="${req.id}">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
        </div>
    `).join('');
            }

            requestsContainer.addEventListener('click', async function(e) {
                    const btn = e.target.closest('button');
                    if (!btn) return;

                    const isDecline = btn.classList.contains('decline-btn');
                    const isAccept = btn.classList.contains('accept-btn');
                    const item = btn.closest('.request-item');
                    const email = item.querySelector('.email-textfeild').textContent.trim();

                    if (isDecline) {
                        if (!confirm(`Reject ${email}?`)) return;

                        try {
                            const resp = await fetch('/reject_join_request', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    classroom_id: classroom_details.id,
                                    email: email
                                })
                            });
                            const result = await resp.json();

                            if (resp.ok && result.success) {
                                item.style.transition = 'opacity 0.3s ease';
                                item.style.opacity = '0';
                                setTimeout(() => item.remove(), 300);
                                joinRequests = joinRequests.filter(r => r.email !== email);
                                updateRequestsBadge();
                            } else {
                                alert(result.error || 'Failed to reject request');
                            }

                        } catch (err) {
                            console.error('Error:', err);
                            alert('Error rejecting request');
                        }
                    }

                    // We'll add Accept logic later
                    if (isAccept) {
                    if (!confirm(`Accept ${email} into this classroom?`)) return;

                    try {
                        const resp = await fetch('/accept_join_request', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                classroom_id: classroom_details.id,
                                email: email
                            })
                        });
                    const result = await resp.json();

                    if (resp.ok && result.success) {
                        item.style.transition = 'opacity 0.3s ease';
                        item.style.opacity = '0';
                        setTimeout(() => item.remove(), 300);
                        joinRequests = joinRequests.filter(r => r.email !== email);
                        updateRequestsBadge();
                        await fetchMembers();
                    } else {
                        alert(result.error || 'Failed to accept request');
                    }

                } catch (err) {
                    console.error('Error:', err);
                    alert('Error accepting request');
                }
                }

            });


            tabMembers.addEventListener('click', () => {
                tabMembers.classList.add('border-blue-600', 'text-blue-600');
                tabMembers.classList.remove('border-transparent', 'text-gray-700');
                tabRequests.classList.remove('border-purple-600', 'text-purple-600');
                tabRequests.classList.add('border-transparent', 'text-gray-700');
                contentMembers.classList.add('active');
                contentRequests.classList.remove('active');
            });

            tabRequests.addEventListener('click', () => {
                tabRequests.classList.add('border-purple-600', 'text-purple-600');
                tabRequests.classList.remove('border-transparent', 'text-gray-700');
                tabMembers.classList.remove('border-blue-600', 'text-blue-600');
                tabMembers.classList.add('border-transparent', 'text-gray-700');
                contentRequests.classList.add('active');
                contentMembers.classList.remove('active');
            });

            // === ORIGINAL SCRIPT (unchanged) ===
            const plusBtn = document.getElementById('plus-btn');
            const plusPopup = document.getElementById('plus-popup');
            const messageInput = document.getElementById('message-input');
            const sendBtn = document.getElementById('send-btn');
            const materialUpload = document.getElementById('material-upload');
            const classroomFeed = document.getElementById('classroom-feed');

            plusBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                plusPopup.classList.toggle('hidden');
                setTimeout(() => plusPopup.classList.toggle('show'), 10);
            });

            window.addEventListener('click', () => {
                if (!plusPopup.classList.contains('hidden')) {
                    plusPopup.classList.remove('show');
                    setTimeout(() => plusPopup.classList.add('hidden'), 300);
                }
            });

            messageInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });

            // 📨 Send message to backend
            sendBtn.addEventListener('click', async () => {
                const message = messageInput.value.trim();
                if (!message) return;

                try {
                    const response = await fetch('/send_message', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            classroom_id: classroom_details.id,
                            message: message
                        })
                    });

                    const result = await response.json();
                    if (result.success) {
                        messageInput.value = '';
                        messageInput.style.height = 'auto';
                    } else {
                        alert(result.message || "Failed to send message");
                    }
                } catch (err) {
                    console.error("Error sending message:", err);
                    alert("Error while sending message");
                }
            });


            messageInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendBtn.click();
                }
            });

            document.getElementById('create-test-link').addEventListener('click', () => {
                const pathParts = window.location.pathname.split('/');
                const classroomId = pathParts[pathParts.length - 1];
                window.location.href = `/create_test/${classroomId}`;
            });

            materialUpload.addEventListener('change', function() {
                const file = this.files[0];
                /*if (file) {
                    const newPost = createPostCard('material', `Shared a new file: ${file.name}`, null, null, file);
                    classroomFeed.insertAdjacentHTML('beforeend', newPost);
                    classroomFeed.scrollTop = classroomFeed.scrollHeight;
                }*/
            });

            async function fetchMembers() {
                try {
                    const resp = await fetch(`/get_members/${classroom_details.id}`);
                    const members = await resp.json();

                    const studentList = document.getElementById('student-list');
                    studentList.innerHTML = '';

                    if (members.length === 0) {
                        studentList.innerHTML = `<p class="text-gray-400 text-sm">No students yet.</p>`;
                        return;
                    }

                    // ✅ Render all members
                    members.forEach(member => {
                        const firstLetter = member.name ? member.name.charAt(0).toUpperCase() : '?';

                        const item = document.createElement('div');
                        item.innerHTML = `
                            <div class="request-item group flex items-center justify-between p-5 bg-white rounded-2xl border border-gray-100 hover:border-gray-200 transition-all duration-300">
                                
                                <!-- Left: Avatar + Info -->
                                <div class="flex items-center space-x-4 flex-1 min-w-0">
                                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-400 to-purple-500 flex items-center justify-center text-white text-sm font-bold shadow-sm">
                                        ${firstLetter}
                                    </div>
                                    <div class="min-w-0">
                                        <p class="text-xs font-medium text-gray-700 truncate">${member.name}</p>
                                        <p class="text-xs text-gray-400 truncate">${member.email}</p>
                                    </div>
                                </div>

                                <!-- Right: Action Buttons -->
                                <div class="flex items-center gap-2">
                                    <button class="view-btn p-2 rounded-full bg-green-50 hover:bg-green-100 text-green-600 transition-all duration-200 group-hover:scale-110" 
                                            title="View Profile" data-id="${member.id}">
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" 
                                            stroke-width="2" stroke="currentColor" class="w-5 h-5">
                                            <path stroke-linecap="round" stroke-linejoin="round" 
                                                d="M12 14c-3.314 0-6 2.014-6 4.5V21h12v-2.5c0-2.486-2.686-4.5-6-4.5zM12 12a4 4 0 100-8 4 4 0 000 8z" />
                                        </svg>
                                    </button>
                                    <button class="remove-btn p-2 rounded-full bg-red-50 hover:bg-red-100 text-red-600 transition-all duration-200 group-hover:scale-110" 
                                            title="Remove" data-id="${member.id}">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" 
                                                d="M6 18L18 6M6 6l12 12"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        `;

                        studentList.appendChild(item);
                    });

                } catch (err) {
                    console.error("Error fetching members:", err);
                }
            }



            document.querySelectorAll('.member-entry').forEach(entry => {
                const nameSpan = entry.querySelector('.member-name');
                nameSpan.textContent = c_user.user_name || "Unknown Teacher";
                const initialDiv = entry.querySelector('.member-initial');
                const name = nameSpan.textContent.trim();
                initialDiv.textContent = name.charAt(0).toUpperCase();
            });
        });
    </script>
    <script type="module">
        //functions
        function createPostCard(type, content, sender = "Unknown", pDate, file) {
            // Format date/time
            let created = formatMessageDate(pDate);
            if(sender === classroom_details.ownerEmail)
                sender = "Teacher";
                else if(sender === classroom_details.userEmail)
                sender = "You";

            // Layout variations
            let html = '';

            // 🗣️ ANNOUNCEMENT
            if (type === 'announcement') {
                html = `
                <div class="flex justify-start">
                    <div class="bg-white rounded-2xl rounded-tl-md shadow-sm px-5 py-4 w-full">
                    <p class="text-gray-800 leading-relaxed">${content}</p>
                    <p class="text-xs text-gray-500 mt-3 text-right">${sender} · ${created}</p>
                    </div>
                </div>`;
            }

            // 📘 STUDY MATERIAL
            else if (type === 'material' && file) {
                const fileName = file.name || 'StudyMaterial.pdf';
                const fileSize = (file.size / (1024 * 1024)).toFixed(1) + ' MB';
                html = `
                <div class="flex justify-start">
                    <div class="bg-white rounded-2xl rounded-tl-md shadow-sm overflow-hidden w-full">
                    <a href="${file.url || '#'}"
                        download="${fileName}"
                        class="flex items-center justify-between p-5 hover:bg-gray-50 transition">
                        <div>
                        <p class="font-medium text-gray-800">${fileName}</p>
                        <p class="text-xs text-gray-500 mt-1">${fileSize} · ${file.type?.toUpperCase() || 'FILE'}</p>
                        </div>
                        <i class="fas fa-download text-xl text-gray-500"></i>
                    </a>
                    <div class="text-right pr-5 pb-3">
                        <span class="text-xs text-gray-500">${created}</span>
                    </div>
                    </div>
                </div>`;
            }

            // 🧩 TEST MESSAGE
            else if (type === 'test') {
                let testInfo = typeof content === 'string' ? JSON.parse(content) : content;
                const start = new Date(testInfo.start_time);
                const end = new Date(testInfo.end_time);
                const now = new Date();

                let status = '';
                let statusColor = 'gray';
                if (now < start) { 
                status = 'Upcoming'; 
                statusColor = 'blue';
                } 
                else if (now >= start && now <= end) { 
                status = 'LIVE'; 
                statusColor = 'green';
                } 
                else { 
                status = 'Ended'; 
                statusColor = 'red';
                }

                const startStr = start.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const endStr = end.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                html = `
                <div class="flex justify-start">
                <div class="bg-white rounded-2xl rounded-tl-md shadow-sm w-full">
                    <div class="p-4">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center gap-2.5">
                        <i class="fas fa-file-alt text-${statusColor}-600"></i>
                        <p class="font-medium text-gray-800 text-base">${testInfo.title || "Untitled Test"}</p>
                        </div>
                        <span class="bg-${statusColor}-500 text-white px-2.5 py-0.5 rounded-full text-xs font-bold">${status}</span>
                    </div>

                    <p class="text-gray-700 text-sm">Code: 
                        <span class="font-bold text-${statusColor}-700">${testInfo.code || "N/A"}</span>
                    </p>

                    <div class="mt-3 flex items-center justify-between text-xs">
                        <div class="text-gray-600">
                        <p><i class="far fa-clock mr-1"></i> <strong>Start:</strong> ${startStr}</p>
                        <p class="mt-0.5"><i class="far fa-stopwatch mr-1"></i> <strong>End:</strong> ${endStr}</p>
                        </div>

                        ${
                        status === 'LIVE'
                            ? `<button 
                                class="start-test-btn bg-green-600 hover:bg-green-700 
                                text-white text-sm font-medium px-6 py-2 rounded-lg transition"
                                data-ref="${testInfo.refKey}">
                                Start Test
                            </button>`
                            : status === 'Ended'
                            ? `<button 
                                class="view-results-btn bg-blue-600 hover:bg-blue-700 
                                text-white text-sm font-medium px-6 py-2 rounded-lg transition"
                                data-ref="${testInfo.refkey}">
                                View Results
                            </button>`
                            : ''
                        }
                    </div>

                    <p class="text-xs text-gray-500 mt-3 text-right">${sender} · ${created}</p>
                    </div>
                </div>
                </div>`;

            }

            return html;
        }
        // 🔗 Handle start test routing
        document.addEventListener('click', (e) => {
            const startBtn = e.target.closest('.start-test-btn');
            if (!startBtn) return;

            const classroomId = window.classroomId;
            const refKey = startBtn.getAttribute('data-ref');

            if (!classroomId || !refKey) {
                console.error("Missing classroomId or test ref key");
                return;
            }

            const testUrl = `/courses/assessment?classroom=${encodeURIComponent(classroomId)}&test=${encodeURIComponent(refKey)}`;
            console.log("Redirecting to:", testUrl);
            window.location.href = testUrl;

        });


        function formatMessageDate(isoString) {    
            try {
                if (!isoString) return '';
                const date = new Date(isoString);
                if (isNaN(date.getTime())) return isoString;

                const now = new Date();

                // Extract dates (ignoring time)
                const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                const yesterday = new Date(today);
                yesterday.setDate(today.getDate() - 1);

                const messageDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());

                // Format time as 12-hour (e.g., 03:25 PM)
                const timeString = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                // Compare day difference
                if (messageDate.getTime() === today.getTime()) {
                return `Today ${timeString}`;
                } else if (messageDate.getTime() === yesterday.getTime()) {
                return `Yesterday ${timeString}`;
                } else {
                // Fallback: show full date
                return date.toLocaleString([], {
                    month: '2-digit',
                    day: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                }
            } catch (e) {
                console.error("Date formatting error:", e);
                return isoString;
            }
        }    


        // Firebase imports    
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getDatabase, ref, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCnx9tSj5_bJk4qwdoHutv_73iUoGHINWE",
            authDomain: "insighteval-e56af.firebaseapp.com",
            databaseURL: "https://insighteval-e56af-default-rtdb.firebaseio.com/",
            projectId: "insighteval-e56af",
            storageBucket: "insighteval-e56af.appspot.com",
            messagingSenderId: "184739995469",
            appId: "1:184739995469:web:9390b124eced0431ff6104"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const classroomId = window.location.pathname.split('/').pop();
        const activitiesRef = ref(db, `classrooms/${classroomId}/activities`);
        const classroomFeed = document.getElementById('classroom-feed');


        // ✅ Listen for new activities in real-time
        onChildAdded(activitiesRef, (snapshot) => {
            const msg = snapshot.val();
            if (!msg) return;
            console.log("🔥 New Message:", msg);

            const refKey = snapshot.key;

            if (msg.type === 3 && msg.test) {
                msg.test.refKey = refKey; 
            }

            let card = '';

            // 🗣️ Type 1 — Announcement
            if (msg.type === 1) {
            card = createPostCard('announcement', msg.message, msg.sender, msg.timestamp, null);
            }

            // 🧩 Type 3 — Test
            else if (msg.type === 3 && msg.test) {
            card = createPostCard('test', msg.test, msg.sender, msg.timestamp, null);
            }

            // Add only new card
            if (card) {
            classroomFeed.insertAdjacentHTML('beforeend', card);
            classroomFeed.scrollTop = classroomFeed.scrollHeight;
            }
        });
</script>
