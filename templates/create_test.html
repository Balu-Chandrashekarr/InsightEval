<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Test - InsightEval</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .option-input-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <main class="p-8 max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Create a New Test</h1>
                <p class="text-md text-gray-600">Design an assessment for your class.</p>
            </div>
            <a href="{{ url_for('classroom_page', classroom_id=1) }}" class="flex items-center space-x-2 text-sm font-semibold text-blue-600 hover:underline">
                <i class="fas fa-arrow-left"></i>
                <span>Back to Classroom</span>
            </a>
        </header>

        <div class="bg-white rounded-lg shadow-lg p-8 space-y-6">
            <!-- Test Details -->
            <div class="space-y-4">
                <div>
                    <label for="test-title" class="block text-lg font-semibold text-gray-700">Test Title</label>
                    <input type="text" id="test-title" placeholder="e.g., Midterm Exam on Data Structures" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="test-description" class="block text-lg font-semibold text-gray-700">Description / Instructions</label>
                    <textarea id="test-description" rows="3" placeholder="Instructions for students..." class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"></textarea>
                </div>
            </div>

            <hr>

            <!-- Questions Section -->
            <div class="space-y-6">
                <h2 class="text-2xl font-bold text-gray-800">Questions</h2>
                <div id="questions-container" class="space-y-6">
                    <!-- Questions will be added here dynamically -->
                </div>

                <!-- Add Question Buttons -->
                <div class="flex items-center gap-4 pt-4 border-t">
                    <span class="font-semibold">Add New Question:</span>
                    <button id="add-mcq-btn" class="bg-blue-100 text-blue-800 font-semibold px-4 py-2 rounded-lg hover:bg-blue-200 flex items-center gap-2">
                        <i class="fas fa-check-circle"></i> Multiple Choice
                    </button>
                    <button id="add-short-answer-btn" class="bg-green-100 text-green-800 font-semibold px-4 py-2 rounded-lg hover:bg-green-200 flex items-center gap-2">
                        <i class="fas fa-paragraph"></i> Short Answer
                    </button>
                    <button id="add-code-btn" class="bg-gray-800 text-white font-semibold px-4 py-2 rounded-lg hover:bg-gray-700 flex items-center gap-2">
                        <i class="fas fa-code"></i> Coding
                    </button>
                </div>
            </div>

            <hr>

            <!-- Final Actions -->
            <div class="flex justify-end gap-4 pt-4">
                <button id="save-draft-btn" class="bg-gray-200 text-gray-800 font-semibold px-6 py-2 rounded-lg hover:bg-gray-300">Save Draft</button>
                <button id="publish-test-btn" class="bg-blue-500 text-white font-bold px-6 py-2 rounded-lg hover:bg-blue-600">Publish Test</button>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const questionsContainer = document.getElementById('questions-container');
            let questionCounter = 0;

            document.getElementById('add-mcq-btn').addEventListener('click', () => addQuestion('mcq'));
            document.getElementById('add-short-answer-btn').addEventListener('click', () => addQuestion('short_answer'));
            document.getElementById('add-code-btn').addEventListener('click', () => addQuestion('code'));

            // -----------------------------------------------------------------
            //  Add a new question (MCQ now has a "correct" radio button)
            // -----------------------------------------------------------------
            function addQuestion(type) {
                questionCounter++;
                const questionId = `question-${questionCounter}`;
                let questionHTML = '';

                switch (type) {
                    case 'mcq':
                        questionHTML = `
                            <div class="p-4 border rounded-lg bg-gray-50 relative" data-qid="${questionId}">
                                <button class="absolute top-2 right-2 text-gray-400 hover:text-red-500" onclick="this.parentElement.remove()">
                                    <i class="fas fa-times-circle"></i>
                                </button>
                                <label class="block text-md font-semibold text-gray-700 mb-2">
                                    Question ${questionCounter} (Multiple Choice)
                                </label>
                                <input type="text" placeholder="Enter the question..." class="w-full p-2 border rounded-md mb-3" data-field="text">

                                <div class="space-y-2 pl-4" data-options-container>
                                    ${[...Array(4)].map((_, i) => mcqOptionHTML(questionId, i)).join('')}
                                </div>

                                <button type="button" class="text-sm text-blue-500 hover:underline mt-2"
                                        onclick="addOption(this, '${questionId}')">+ Add Option</button>
                            </div>`;
                        break;

                    case 'short_answer':
                        questionHTML = `
                            <div class="p-4 border rounded-lg bg-gray-50 relative">
                                <button class="absolute top-2 right-2 text-gray-400 hover:text-red-500" onclick="this.parentElement.remove()">
                                    <i class="fas fa-times-circle"></i>
                                </button>
                                <label class="block text-md font-semibold text-gray-700 mb-2">
                                    Question ${questionCounter} (Short Answer)
                                </label>
                                <textarea placeholder="Enter the question..." rows="2"
                                          class="w-full p-2 border rounded-md"></textarea>
                            </div>`;
                        break;

                    case 'code':
                        questionHTML = `
                            <div class="p-4 border rounded-lg bg-gray-50 relative">
                                <button class="absolute top-2 right-2 text-gray-400 hover:text-red-500" onclick="this.parentElement.remove()">
                                    <i class="fas fa-times-circle"></i>
                                </button>
                                <label class="block text-md font-semibold text-gray-700 mb-2">
                                    Question ${questionCounter} (Coding Challenge)
                                </label>
                                <textarea placeholder="Describe the coding problem..." rows="4"
                                          class="w-full p-2 border rounded-md font-mono text-sm"></textarea>
                            </div>`;
                        break;
                }
                questionsContainer.insertAdjacentHTML('beforeend', questionHTML);
            }

            // -----------------------------------------------------------------
            //  Helper: HTML for a single MCQ option (radio + text + delete)
            // -----------------------------------------------------------------
            function mcqOptionHTML(questionId, index) {
                return `
                    <div class="option-input-group">
                        <input type="radio" name="${questionId}-correct" class="form-radio text-blue-500" required>
                        <input type="text" placeholder="Option ${index + 1}" class="flex-1 p-2 border rounded-md" data-option-text>
                        <button type="button" class="text-gray-400 hover:text-red-500"
                                onclick="this.parentElement.remove()">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>`;
            }

            // -----------------------------------------------------------------
            //  Add a new option to an existing MCQ
            // -----------------------------------------------------------------
            window.addOption = function (button, questionId) {
                const container = button.previousElementSibling; // data-options-container
                const optionCount = container.children.length;
                const newHTML = mcqOptionHTML(questionId, optionCount);
                container.insertAdjacentHTML('beforeend', newHTML);
            };

            // -----------------------------------------------------------------
            //  Collect the whole test into a JSON-friendly structure
            // -----------------------------------------------------------------
            function getTestData() {
                const title = document.getElementById('test-title').value.trim();
                const description = document.getElementById('test-description').value.trim();

                const questions = Array.from(questionsContainer.children).map(qDiv => {
                    const type = qDiv.querySelector('label').textContent.includes('Multiple Choice') ? 'mcq' :
                                 qDiv.querySelector('label').textContent.includes('Short Answer') ? 'short_answer' : 'code';

                    if (type === 'mcq') {
                        const text = qDiv.querySelector('[data-field="text"]').value.trim();
                        const optionsContainer = qDiv.querySelector('[data-options-container]');
                        const optionElements = optionsContainer.querySelectorAll('.option-input-group');

                        const options = Array.from(optionElements).map(el => ({
                            text: el.querySelector('[data-option-text]').value.trim(),
                            correct: el.querySelector('input[type="radio"]').checked
                        }));

                        // Find the correct index (for direct mapping)
                        const correctIndex = options.findIndex(o => o.correct);
                        if (correctIndex === -1) throw new Error('Please select a correct answer for MCQ question.');

                        return { type, text, options, correctIndex };
                    }

                    // Short answer & coding – no correct answer needed here
                    const text = qDiv.querySelector('textarea').value.trim();
                    return { type, text };
                });

                return { title, description, questions };
            }

            // -----------------------------------------------------------------
            //  Save / Publish handlers (demo – replace with real fetch)
            // -----------------------------------------------------------------
            document.getElementById('save-draft-btn').addEventListener('click', () => {
                try {
                    const data = getTestData();
                    console.log('Draft data →', data);
                    alert('Draft saved (check console)');
                } catch (e) {
                    alert(e.message);
                }
            });

            document.getElementById('publish-test-btn').addEventListener('click', () => {
                try {
                    const data = getTestData();
                    console.log('Publish data →', data);
                    alert('Test published (check console)');
                    // Example POST:
                    // fetch('/api/tests', {method:'POST', body:JSON.stringify(data), headers:{'Content-Type':'application/json'}})
                } catch (e) {
                    alert(e.message);
                }
            });
        });
    </script>
</body>
</html>
